<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>记事本 · 前端原型</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
 * design-systems/apple/tokens.css
 *
 * Structured token bindings for the Apple-inspired design system —
 * a precision editorial language built around white-space discipline,
 * SF Pro typography, and a single restrained blue accent. This file
 * is the *machine-readable* form of the values described in
 * `DESIGN.md`. Agents are expected to paste the `:root { … }` block
 * verbatim into the first `<style>` of every artifact they generate
 * against this design system, then reference everything via
 * var(--name) from then on.
 *
 * Why this file exists:
 *   DESIGN.md tells humans that Apple uses "Pale Apple Gray (#f5f5f7)
 *   as the main light surface" and "Apple Action Blue (#0071e3) as the
 *   primary accent", but agents have to translate those prose names
 *   into the standard token names the lint enforces (`--surface`,
 *   `--accent`). This file pre-translates the brand once, so agents
 *   copy structure instead of inventing it.
 *
 * Brand-specific schema decisions (non-obvious bindings worth flagging
 * for reviewers and downstream brand authors):
 *   1. We bind --surface-warm to a real intermediate tier (#fbfbfd),
 *      NOT an alias of --surface. Apple's surface ladder genuinely has
 *      three light stops — pure white retail canvas, near-white
 *      brightness-shifted bands, and pale Apple gray feature fields —
 *      so collapsing surface-warm would erase a real brand feature.
 *   2. We bind --fg-2, --meta, and --border-soft to independent values
 *      rather than aliases. Apple's neutral text ramp is famously
 *      four-stop (Near-Black Ink → Utility Dark Gray → Secondary
 *      Neutral Gray → Mid Border Gray) and the schema's B-slots map
 *      onto it cleanly.
 *   3. --radius-pill is bound to 980px, not 9999px. Apple's signature
 *      capsule CTA literally uses 980px in published CSS, and the
 *      number is itself a brand-recognisable detail; we keep it.
 *   4. --accent-hover lifts (#0077ed) instead of darkening. Apple's
 *      live blue buttons brighten slightly on hover rather than mix
 *      toward black; the schema's default formula would fight that.
 *      --accent-active darkens to #0066cc — the documented Body Link
 *      Blue — so the active state aligns with Apple's read-link tone.
 *   5. --tracking-display is -0.015em. The DESIGN.md hierarchy lists
 *      -1.2px on 80px hero (-0.015em); tighter than that breaks at
 *      smaller display sizes, looser loses Apple's machined feel.
 *   6. --section-y-desktop is 100px. Apple's billboard chapters lean
 *      noticeably more generous than the schema default of 80px — the
 *      breathing room is what lets product imagery do the talking.
 *   7. --ease-standard is cubic-bezier(0.28, 0, 0.22, 1), an Apple-
 *      flavoured smooth-out instead of the schema default. Apple
 *      transitions decelerate hard then settle, never bounce.
 *
 * Contract sources:
 *   - Standard token names: design-systems/_schema/tokens.schema.ts
 *       (TOKEN_SCHEMA — every name below appears there or as an
 *        explicit B-slot alias.)
 *   - A2 fallback values: design-systems/_schema/defaults.css
 *       (We override --motion-base, --ease-standard, --elev-raised,
 *        --focus-ring, --radius-pill; the rest match defaults.)
 *   - Lint enforcement: apps/daemon/src/lint-artifact.ts
 *       (raw-hex >12 outside :root → P1; non-token accent → P0)
 *
 * Keep this file additive: never invent token names not also documented
 * in DESIGN.md or the shared schema. New Apple-derived sub-brands
 * cloning this template should overwrite values, not rename keys.
 * ─────────────────────────────────────────────────────────────────── */

:root {
  /* ─── Surface (3 levels) ──────────────────────────────────────────
   * Apple's binary section rhythm alternates pure white retail/hero
   * canvases with pale Apple gray feature fields. We bind --bg to
   * the white canvas (the most common default Apple page background)
   * and --surface to the pale gray that cards and feature bands lift
   * onto. --surface-warm is bound to a real third tier (#fbfbfd) —
   * the near-white brightness shift that appears between hero and
   * pale-gray bands on apple.com. Collapsing it to var(--surface)
   * would erase a real brand feature, so we keep it independent. */
  --bg: #ffffff;
  --surface: #f5f5f7;
  --surface-warm: #fbfbfd;

  /* ─── Foreground ramp (4 levels) ─────────────────────────────────
   * Apple's text neutrals are explicitly named in DESIGN.md §2:
   * Near-Black Ink (primary), Utility Dark Gray (secondary text /
   * dark-neutral surfaces in store contexts), Secondary Neutral Gray
   * (helper copy / tertiary metadata), Mid Border Gray (the strongest
   * neutral, used for stronger field outlines and the most-restrained
   * caption tier). We bind all four — Apple genuinely walks the full
   * ramp, so collapsing --fg-2 or --meta to siblings would flatten
   * the brand.
   *
   * Note that none of these are pure black (#000000). #000000 is
   * reserved for hero canvases and dark chapters; for body type on
   * white, #1d1d1f gives the slight warmth that reads as Apple. */
  --fg: #1d1d1f;
  --fg-2: #424245;
  --muted: #6e6e73;
  --meta: #86868b;

  /* ─── Border (2 levels) ──────────────────────────────────────────
   * Soft Border Gray (#d2d2d7) is Apple's default divider weight and
   * card-edge color. --border-soft is bound to a lighter near-neutral
   * (#e8e8ed) for inner row separators in dense retail tables and
   * configurator option lists, where the d2d2d7 hairline would
   * over-compete with the option labels. */
  --border: #d2d2d7;
  --border-soft: #e8e8ed;

  /* ─── Accent ──────────────────────────────────────────────────────
   * Apple Action Blue — the system's only persistent chromatic move.
   * DESIGN.md §7 ("Don't introduce broad secondary accent palettes
   * that compete with Apple blue") makes this a one-color brand for
   * action and link semantics; the schema's hard cap of ≤2 visible
   * accent uses per screen aligns naturally. */
  --accent: #0071e3;
  --accent-on: #ffffff; /* white label on the blue fill */

  /* ─── Accent states ───────────────────────────────────────────────
   * Apple's live primary buttons LIGHTEN on hover (the blue gains
   * luminance) and darken on press. The schema's default black-mix
   * formula would fight that motion, so we hand-pick both values:
   *   - hover: #0077ed (≈ 4% brighter than --accent)
   *   - active: #0066cc (the documented Body Link Blue from DESIGN.md
   *             §2, which doubles cleanly as the press tone)
   *
   * Schema rule: every brand provides --accent-hover and
   * --accent-active. The binding strategy (formula / hand-picked /
   * identity) is brand-decided. Default uses formulas; kami uses
   * identity + hand-picked; Apple uses hand-picked in both
   * directions. */
  --accent-hover: #0077ed;
  --accent-active: #0066cc;

  /* ─── Semantic ────────────────────────────────────────────────────
   * Apple's DESIGN.md §2 explicitly notes "no distinct semantic
   * palette was consistently visible in the extracted surface set" —
   * so we inherit the schema defaults verbatim. Apple artifacts
   * almost never need success / warn / danger; when they do, the
   * defaults are restrained enough not to fight the blue accent.
   * Reserve under 5% of any surface area regardless. */
  --success: #16a34a;
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ──────────────────────────────────────────────────
   * Apple's documented split is two SF Pro families: SF Pro Display
   * for hero / merchandising headings, SF Pro Text for navigation,
   * controls, and dense commerce copy. We mirror the exact published
   * fallback chain (SF Pro Icons → Helvetica Neue → Helvetica → Arial
   * → sans-serif) so artifacts rendered on non-macOS clients land on
   * the closest practical substitute.
   *
   * SF Mono leads the monospace stack — Apple's brand mono — with
   * the schema fallbacks behind it for portability. */
  --font-display:
    "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body:
    "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:
    "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale (px) — derived from DESIGN.md §3 hierarchy table.
   * Apple's body baseline is 17px (NOT the 16px web norm) because
   * SF Pro Text was metrically tuned at 17 for Retina; rebinding
   * --text-base to anything else collapses the brand's reading
   * texture. The display ceiling is the 80px Hero Display XL. */
  --text-xs:   12px;   /* Micro UI — fine print, micro labels */
  --text-sm:   14px;   /* Control Label — buttons, helper labels */
  --text-base: 17px;   /* Body Primary — Apple's reading baseline */
  --text-lg:   21px;   /* Link/Action Heading — large promo links */
  --text-xl:   28px;   /* Card/Product Title — tile-level naming */
  --text-2xl:  40px;   /* Product Heading — campaign section titles */
  --text-3xl:  56px;   /* Hero Display L — homepage hero moments */
  --text-4xl:  80px;   /* Hero Display XL — Environment / store hero */

  /* Apple's leading envelope is unusually tight at the top of the
   * scale (display sizes ride at 1.00–1.10) and unusually airy in
   * the body (1.47, well above the web 1.4 default). Both numbers
   * come straight from DESIGN.md §3. */
  --leading-body:  1.47;   /* SF Pro Text body, 17px */
  --leading-tight: 1.05;   /* Hero Display XL ceiling */

  /* Display tracking compresses to -0.015em — the famous Apple
   * machined-headline feel. DESIGN.md §3 lists -1.2px on 80px
   * (≈ -0.015em); we bind a single em-value so the same rule applies
   * across the display tiers. Body type runs at 0 / -0.374px and is
   * left to component-level rules so as not to hurt readability. */
  --tracking-display: -0.015em;

  /* ─── Spacing ─────────────────────────────────────────────────────
   * Apple's underlying grid is 8px (DESIGN.md §5), with utility
   * micro-steps (2/4/6/7/8/9/10) for precision alignment. The shared
   * schema's 4-8-12-16-20-24-32-48 scale fits cleanly — we inherit
   * the defaults. Component-internal values that don't match a token
   * (Apple's 14px or 17px utility intervals) stay inline at the
   * call site rather than spawning extra spacing tokens. */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* ─── Section rhythm ──────────────────────────────────────────────
   * Apple's billboard chapters lean noticeably more generous than the
   * schema default of 80px — broad top/bottom breathing room is what
   * lets product imagery dominate the page. We bind 100/64/40, a
   * slightly wider envelope than default's 80/48/32. */
  --section-y-desktop: 100px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  /* ─── Radius ──────────────────────────────────────────────────────
   * Apple uses purposeful radius tiers (DESIGN.md §5 §7 — "don't
   * flatten all corners to a single radius"). The mapping:
   *   --radius-sm   → 8px   compact controls and fields
   *   --radius-md   → 12px  standard buttons, configurator chips
   *   --radius-lg   → 18px  cards, module frames, commerce panels
   *   --radius-pill → 980px Apple's signature capsule CTA — we keep
   *                          the literal value rather than collapse
   *                          to 9999px because the number itself is
   *                          a brand-recognisable detail in Apple's
   *                          published CSS.
   *
   * The 28-36px spotlight tier and the 56px capsule sub-tier are
   * component-internal one-offs and stay inline — they do not earn
   * their own tokens until a second use appears. */
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   18px;
  --radius-pill: 980px;

  /* ─── Elevation (3 levels) ────────────────────────────────────────
   * Apple uses depth sparingly (DESIGN.md §6 — "depth is intentionally
   * restrained"). Three sanctioned levels:
   *   - flat   → none (the default; tonal contrast does the work)
   *   - ring   → 0 0 0 1px var(--border) (border-led containment in
   *              dense retail contexts)
   *   - raised → 0 12px 32px rgba(0,0,0,0.08) (the soft Apple card
   *              shadow; rgba 0.08 is the lower bound from DESIGN.md
   *              §6's "0.08 → 0.22" range, which keeps cards from
   *              feeling Material-flavoured)
   *
   * No fourth level — that would be the Material/neumorphism stack
   * Apple consciously avoids. */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);

  /* ─── Focus ring ──────────────────────────────────────────────────
   * Apple's keyboard-focus signal is a soft blue glow at the action
   * accent (DESIGN.md §6 — "Blue focus signal (#0071e3) for keyboard
   * and selection emphasis"). We use a 4px ring at ~35% accent
   * opacity, slightly larger than the schema's 3px default so it
   * reads as the deliberate Apple halo rather than a generic outline.
   * Implemented as a box-shadow so it layers outside the element
   * without affecting layout. */
  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);

  /* ─── Motion ──────────────────────────────────────────────────────
   * Apple transitions decelerate hard and settle — never bounce,
   * never spring past the target. We override the schema default
   * easing with cubic-bezier(0.28, 0, 0.22, 1), the curve Apple
   * uses on apple.com for hover and section reveals; --motion-base
   * is bumped from 200ms → 220ms because Apple's micro-interactions
   * carry slightly more cinematic weight than the web default.
   * --motion-fast stays at 150ms for true micro-states (hover tints,
   * focus, kbd press feedback). */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);

  /* ─── Layout ──────────────────────────────────────────────────────
   * Apple's marketing core is a constrained readable column with
   * generous outer margins (DESIGN.md §5). 1024px max keeps lines
   * inside the SF Pro Text comfortable-measure ceiling (~80ch at
   * 17px) while leaving the chapter band full-bleed. Gutters step
   * 22 → 18 → 16 across desktop / tablet / phone — slightly tighter
   * than default to honor Apple's "broad horizontal breathing room
   * but column-disciplined content" balance. */
  --container-max:            1024px;
  --container-gutter-desktop: 22px;
  --container-gutter-tablet:  18px;
  --container-gutter-phone:   16px;
}

/* ─── 深色主题覆写（oklch 推导，非反色） ─────────────────────────────── */
html[data-theme="dark"]{
  --bg: oklch(.175 .004 280);
  --surface: oklch(.140 .004 280);
  --surface-warm: oklch(.155 .004 280);
  --fg: oklch(.955 .002 285);
  --fg-2: oklch(.84 .004 285);
  --muted: oklch(.72 .005 285);
  --meta: oklch(.60 .006 285);
  --border: oklch(.30 .005 280);
  --border-soft: oklch(.245 .004 280);
  --accent: oklch(.68 .185 256);
  --accent-hover: oklch(.735 .19 256);
  --accent-active: oklch(.63 .17 256);
  --elev-raised: 0 12px 32px rgba(0,0,0,.45);
  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 72%);
  color-scheme: dark;
}
html[data-theme="light"]{color-scheme: light;}

/* ─── 基础 ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"SF Pro Text",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;color:var(--fg);background:var(--surface);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit;border:none;outline:none;background:none}
*{transition:background-color .22s var(--ease-standard),border-color .22s var(--ease-standard),color .22s var(--ease-standard)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--fg) 16%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in oklab,var(--fg) 28%,transparent);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}
::selection{background:color-mix(in oklab,var(--accent) 26%,transparent)}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes spinOnce{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spin{animation:spinOnce .45s var(--ease-standard)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ─── 图标按钮 ─────────────────────────────────────────────────────── */
.icon-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--radius-sm);color:var(--fg-2);transition:background-color var(--motion-fast) var(--ease-standard),color var(--motion-fast),transform var(--motion-fast)}
.icon-btn:hover{background:color-mix(in oklab,var(--fg) 7%,transparent);color:var(--fg)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.accent{color:var(--accent)}
.icon-btn.accent:hover{background:color-mix(in oklab,var(--accent) 12%,transparent);color:var(--accent)}
.btn-primary{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 22px;border-radius:var(--radius-pill);background:var(--accent);color:var(--accent-on);font-size:14px;transition:background-color var(--motion-base) var(--ease-standard),transform var(--motion-fast),box-shadow var(--motion-base)}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 16px color-mix(in oklab,var(--accent) 35%,transparent)}
.btn-primary:active{background:var(--accent-active);transform:scale(.97)}
.btn-primary svg{width:15px;height:15px}

/* ─── 标题栏 ───────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%;min-width:940px}
.titlebar{flex:none;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:color-mix(in oklab,var(--bg) 66%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border-soft);position:relative;z-index:50}
.traffic{display:flex;gap:8px;flex:none}
.tl{width:12px;height:12px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.tl.red{background:oklch(.72 .19 18)}
.tl.yellow{background:oklch(.82 .17 85)}
.tl.green{background:oklch(.72 .23 145)}
.tl::after{content:'';position:absolute;inset:0;display:grid;place-items:center;font-size:9px;line-height:1;font-weight:700;color:rgba(0,0,0,.55);opacity:0;transition:opacity var(--motion-fast)}
.tl:hover::after{opacity:1}
.tl.red::after{content:'×'}
.tl.yellow::after{content:'−'}
.tl.green::after{content:'+'}
.tl:active{transform:scale(.88)}
.brand{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.brand-icon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,oklch(.68 .185 256),oklch(.60 .21 295));display:grid;place-items:center;color:oklch(1 0 0);box-shadow:0 2px 6px color-mix(in oklab,var(--accent) 35%,transparent);flex:none}
.brand-icon svg{width:12px;height:12px}
.brand-name{font:600 14px/1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.search-wrap{flex:1;max-width:460px;margin:0 auto;position:relative}
.search-box{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:9px;background:color-mix(in oklab,var(--fg) 6%,transparent);border:1px solid transparent}
.search-box:focus-within{background:var(--bg);border-color:color-mix(in oklab,var(--accent) 50%,transparent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.search-box svg{width:14px;height:14px;color:var(--meta);flex:none}
.search-box input{flex:1;min-width:0;font-size:13px;height:100%}
.search-box input::placeholder{color:var(--meta)}
.search-box input:focus-visible{box-shadow:none}
.search-clear{width:18px;height:18px;border-radius:5px;display:none;place-items:center;color:var(--meta);flex:none;transition:background-color var(--motion-fast),color var(--motion-fast)}
.search-clear:hover{background:color-mix(in oklab,var(--fg) 10%,transparent);color:var(--fg)}
.search-clear svg{width:11px;height:11px}
.search-wrap.has-q .search-clear{display:grid}
.tb-actions{display:flex;align-items:center;gap:6px;flex:none}
.settings-wrap{position:relative}
.popover{position:absolute;top:42px;right:0;width:252px;background:var(--bg);border:1px solid var(--border-soft);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:8px;display:none;z-index:120}
html[data-theme="dark"] .popover{box-shadow:0 18px 50px rgba(0,0,0,.6)}
.popover.open{display:block;animation:popIn .18s var(--ease-standard)}
.po-title{font-size:11.5px;font-weight:600;color:var(--meta);letter-spacing:.02em;padding:6px 10px 4px}
.po-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--fg-2)}
.po-row:hover{background:color-mix(in oklab,var(--fg) 5%,transparent);color:var(--fg)}
.po-meta{font-size:12px;color:var(--meta)}
.po-note{font-size:12px;line-height:1.55;color:var(--meta);padding:8px 10px;border-top:1px solid var(--border-soft);margin-top:4px}
.seg-mini{display:flex;background:color-mix(in oklab,var(--fg) 8%,transparent);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg-mini-btn{height:24px;padding:0 12px;border-radius:6px;font-size:12.5px;color:var(--fg-2);transition:background-color var(--motion-fast),color var(--motion-fast),box-shadow var(--motion-fast)}
.seg-mini-btn:hover{color:var(--fg)}
.seg-mini-btn.on{background:var(--bg);color:var(--fg);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.14)}
html[data-theme="dark"] .seg-mini-btn.on{box-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ─── 三栏布局 ─────────────────────────────────────────────────────── */
#main{flex:1;display:flex;min-height:0}
#sidebar{flex:0 0 220px;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--border-soft);min-width:0;overflow:hidden;transition:flex-basis .28s var(--ease-standard);position:relative;z-index:10}
#sidebar.rail{flex-basis:56px}
.side-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.side-item{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--fg-2);white-space:nowrap;transition:background-color var(--motion-fast) var(--ease-standard),color var(--motion-fast)}
.side-item svg{width:15px;height:15px;flex:none}
.side-item:hover{background:color-mix(in oklab,var(--fg) 6%,transparent);color:var(--fg)}
.side-item.on{background:color-mix(in oklab,var(--accent) 12%,transparent);color:var(--accent)}
.side-item .si-label{flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder-row .si-label,.tag-pill .si-label{flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
.side-item .cnt{margin-left:auto;font-size:11.5px;color:var(--meta);font-variant-numeric:tabular-nums;flex:none}

/* ─── 笔记列表 ─────────────────────────────────────────────────────── */

.card{position:relative;padding:12px 13px 10px;border-radius:var(--radius-md);background:color-mix(in oklab,var(--bg) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-soft);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color var(--motion-fast) var(--ease-standard),box-shadow var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard),background-color var(--motion-fast)}

mark{background:oklch(.88 .16 100);color:oklch(.27 .06 60);border-radius:3px;padding:0 2px}

/* ─── 编辑区 ───────────────────────────────────────────────────────── */

.tab:hover{background:color-mix(in oklab,var(--fg) 6%,transparent);color:var(--fg)}

.fmt-btn:hover{background:color-mix(in oklab,var(--fg) 7%,transparent);color:var(--fg)}

.jsonbar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--border-soft);background:color-mix(in oklab,var(--accent) 5%,var(--bg));flex:none}
.jb-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg-2);flex:none}

.page{width:100%;max-width:780px;margin:0 auto;padding:34px 44px 90px}
.title-input{font:600 28px/1.35 var(--font-display);letter-spacing:-.015em;width:100%;margin-bottom:16px;caret-color:var(--accent)}
.title-input::placeholder{color:var(--meta)}
.title-input:focus-visible,.body-input:focus-visible{box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 10%,transparent);border-radius:4px}

/* ─── 代码块（双主题统一深色） ──────────────────────────────────────── */
.codeblock{margin:16px 0;border-radius:var(--radius-md);background:oklch(.216 .017 259);box-shadow:0 6px 18px rgba(0,0,0,.18);overflow:hidden}

/* ─── JSON 树状视图 ────────────────────────────────────────────────── */
.jsonview{height:100%;overflow-y:auto}
.jv-head{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}

# Python 脚本：批量重命名文件

整理下载目录里散落的图片，统一命名为 `IMG_日期_序号`。

```python
import os
from datetime import date
from pathlib import Path

def rename_images(directory: str) -> None:
    """将目录下的图片按拍摄日期重命名。"""
    today = date.today().isoformat()
    for index, path in enumerate(Path(directory).glob("*.jpg"), start=1):
        new_name = f"IMG_{today}_{index:03d}{path.suffix}"
        path.rename(path.with_name(new_name))
        print(f"重命名：{path.name} → {new_name}")

if __name__ == "__main__":
    rename_images("~/Downloads")
```

> 注意：先备份再运行，`Path.rename` 不会自动覆盖检查。

<script type="text/plain" id="note-n4">
# JavaScript 异步编程笔记

三种写异步的方式，本质都是对 Promise 的包装。

```javascript
async function fetchUser(id) {
  const res = await fetch("/api/users/" + id);
  if (!res.ok) throw new Error("请求失败：" + res.status);
  return res.json();
}

fetchUser(42)
  .then(user => console.log(user.name))
  .catch(err => console.error(err));
```

- `async/await`：可读性最好，配合 try/catch 使用
- `.then/.catch`：适合简单的链式调用
- 回调：仅用于事件监听等场景

## 常见陷阱

1. `forEach` 里的 `await` 不会等待，改用 `for...of`
2. 并发请求用 `Promise.all`，失败会整体拒绝

# 读《设计中的设计》

> 设计的本质，不是制造新的东西，而是重新发现日常。

原研哉在书中反复提到「白」的概念——留白不是空白，而是充满可能性的空间。

## 摘录

- 「设计不是一种技能，而是捕捉事物本质的感觉能力和洞察能力。」
- 「把已知的东西陌生化，是一种创造简单的方法。」

| 白 · 留白 | 界面中的呼吸感与层级 |

function hl(code,lang){
  var def=null;
  for(var i=0;i<HL.length;i++)if(HL[i][0]===lang)def=HL[i][1];
  if(!def)def=HL[5][1];
  if(!def.length)return esc(code);
  var src=esc(code);
  var parts=[];
  for(var j=0;j<def.length;j++)parts.push('('+def[j][0].source+')');
  var master=new RegExp(parts.join('|'),'gm');
  var cls=def.map(function(d){return d[1];});
  return src.replace(master,function(){
    var args=Array.prototype.slice.call(arguments);
    for(var k=0;k<cls.length;k++){if(args[1+k]!==undefined)return '<span class="tok-'+cls[k]+'">'+args[1+k]+'</span>';}
    return args[0];
  });
}

/* ── Markdown 渲染 ─────────────────────────────────────────────────── */
function inlineMd(s){
  s=esc(s);
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  return s;
}
function renderMd(src){
  var lines=src.split(/\r?\n/),html='',i=0;
  while(i<lines.length){
    var line=lines[i];
    if(line.trim()===''){i++;continue;}
    var m=line.match(/^```(\w*)/);
    if(m){
      var lang=m[1]||'text',buf=[],k=0;i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim()))buf.push(lines[i++]);
      i++;
      html+='<div class="codeblock"><div class="cb-head"><span class="cb-lang">'+esc(lang)+'</span><button type="button" class="cb-copy">'+icon('copy')+'<span>复制</span></button></div><pre><code class="lang-'+esc(lang)+'">'+hl(buf.join('\n'),lang)+'</code></pre></div>';
      continue;
    }
    m=line.match(/^(#{1,6})\s+(.*)/);
    if(m){var n=Math.min(m[1].length,3);html+='<h'+n+'>'+inlineMd(m[2])+'</h'+n+'>';i++;continue;}
    if(/^>\s?/.test(line)){
      var q=[];
      while(i<lines.length&&/^>\s?/.test(lines[i]))q.push(lines[i].replace(/^>\s?/,''));
      i++;
      html+='<blockquote>'+q.map(function(l){return '<p>'+inlineMd(l)+'</p>';}).join('')+'</blockquote>';
      continue;
    }
    if(/^\s*\|/.test(line)){
      var rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(lines[i]);
      i++;
      if(rows.length>1&&/^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1])){
        var head=rows[0].split('|').slice(1,-1).map(function(s){return s.trim();});
        var body=rows.slice(2).map(function(r){return r.split('|').slice(1,-1).map(function(s){return inlineMd(s.trim());});});
        html+='<table><thead><tr>'+head.map(function(h){return '<th>'+inlineMd(h)+'</th>';}).join('')+'</tr></thead><tbody>'+body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
      }else{html+=rows.map(function(r){return '<p>'+inlineMd(r.trim())+'</p>';}).join('');}
      continue;
    }
    if(/^\s*[-*+]\s+/.test(line)||/^\s*\d+\.\s+/.test(line)){
      var items=[];
      while(i<lines.length&&(/^\s*[-*+]\s+/.test(lines[i])||/^\s*\d+\.\s+/.test(lines[i])))items.push(lines[i++]);
      var ordered=/^\s*\d+\.\s+/.test(items[0]);
      var isTask=items.some(function(l){return /\[[ xX]\]/.test(l);});
      html+='<'+(isTask?'ul class="tasklist"':(ordered?'ol':'ul'))+'>'+items.map(function(l){
        var t=l.replace(/^\s*[-*+]\s+/,'').replace(/^\s*\d+\.\s+/,'');
        var tm=t.match(/^\[([ xX])\]\s+(.*)/);
        if(tm){
          var done=tm[1].toLowerCase()==='x';
          return '<li class="'+(done?'done':'')+'"><span class="taskbox">'+(done?icon('check'):'')+'</span>'+inlineMd(tm[2])+'</li>';
        }
        return '<li>'+inlineMd(t)+'</li>';
      }).join('')+'</'+(isTask?'ul':(ordered?'ol':'ul'))+'>';
      continue;
    }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(line)){html+='<hr>';i++;continue;}
    html+='<p>'+inlineMd(line)+'</p>';
    i++;
  }
  return html;
}

/* ── JSON 工具 ─────────────────────────────────────────────────────── */
function jsonOf(note){
  if(!note)return null;
  var b=note.body;
  if(/^\s*[{[]/.test(b)){
    try{return {json:JSON.parse(b),text:b,offset:0};}catch(e){return {err:e,text:b};}
  }
  var m=b.match(/```json\s*\n([\s\S]*?)\n```/);
  if(m){
    try{return {json:JSON.parse(m[1]),text:m[1],offset:m.index};}catch(e){return {err:e,text:m[1]};}
  }
  return null;
}
function buildTree(node,path){
  if(node===null)return '<span class="jt-null">null</span>';
  if(typeof node==='boolean')return '<span class="jt-bool">'+node+'</span>';
  if(typeof node==='number')return '<span class="jt-num">'+node+'</span>';
  if(typeof node==='string')return '<span class="jt-str">"'+esc(node)+'"</span>';
  var isArr=Array.isArray(node);
  var keys=isArr?node.map(function(_,i){return String(i);}):Object.keys(node);
  var open=S.expanded.has(path);
  var hint=isArr?('['+keys.length+' 项]'):('{'+keys.length+' 个键}');
  return '<div class="jt-node"><span class="jt-row"><button type="button" class="jt-caret'+(open?'':' closed')+'" data-p="'+escAttr(path)+'" aria-label="展开或收起">'+icon('chevron')+'</button><span class="jt-bracket">'+(isArr?'[':'{')+'</span><span class="jt-hint">'+hint+'</span></span>'
    +'<span class="jt-children'+(open?'':' closed')+'">'
    +keys.map(function(k){
      var v=node[k];
      var child=isArr?path+'['+k+']':path+'.'+k;
      var label=isArr?'<span class="jt-idx">'+k+'</span>':'<span class="jt-key">"'+esc(k)+'"</span>';
      return '<span class="jt-entry">'+label+'<span class="jt-punct">: </span>'+buildTree(v,child)+'</span>';
    }).join('')+'</span></div>';
}
function collectPaths(node,path,out){
  out.push(path);
  if(node&&typeof node==='object'){
    var keys=Array.isArray(node)?node.map(function(_,i){return String(i);}):Object.keys(node);
    for(var i=0;i<keys.length;i++){
      var k=keys[i],child=Array.isArray(node)?path+'['+k+']':path+'.'+k;
      collectPaths(node[k],child,out);
    }
  }
}

/* ── 搜索高亮 ──────────────────────────────────────────────────────── */
function markHit(text,q){
  var e=esc(text);
  if(!q)return e;
  try{
    var re=new RegExp('('+escReg(q)+')','gi');
    return e.replace(re,'<mark>$1</mark>');
  }catch(err){return e;}
}
function summaryOf(n){
  var lines=n.body.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var t=lines[i].replace(/^#{1,6}\s+/,'').replace(/^>\s?/,'').replace(/^\s*[-*+]\s+/,'').replace(/^```.*/,'').trim();
    if(t)return t.replace(/[*`\[\]]/g,'').trim();
  }
  return '暂无内容';
}
function countIn(path){
  var c=0;
  for(var i=0;i<NOTES.length;i++){var f=NOTES[i].folder;if(f===path||f.indexOf(path+'/')===0)c++;}
  return c;
}
function notesWithTag(t){return NOTES.filter(function(n){return n.tags.indexOf(t)>=0;});}
function isFilter(kind,val){
  if(S.q)return false;
  return S.filter.kind===kind&&(val===undefined||S.filter.value===val);
}

  if(S.jsonTree){c.className='content tree';c.innerHTML=treeHTML(note);syncSeg();updateStatus();return;}
  c.className='content '+S.mode;
  c.innerHTML='<div class="edit-pane"><div class="page"><input class="title-input" id="titleInput" data-od-id="note-title" placeholder="无标题" value="'+escAttr(note.title)+'" spellcheck="false"><textarea class="body-input" id="bodyInput" data-od-id="note-body" placeholder="开始书写…" spellcheck="false">'+esc(note.body)+'</textarea></div></div>'
    +'<div class="preview-pane"><div class="page preview" data-od-id="note-preview"></div></div>';
  syncSeg();
  if(S.mode!=='preview'){
    var ta=el('bodyInput');
    autoResize(ta);
    ta.addEventListener('input',function(){note.body=ta.value;autoResize(ta);updatePreview(note);updateStatus();markDirty();});
    ta.addEventListener('keyup',updateCursor);
    ta.addEventListener('click',updateCursor);
    var ti=el('titleInput');
    ti.addEventListener('input',function(){note.title=ti.value;renderTabs();renderList();saveState();});
  }
  if(S.mode!=='edit')updatePreview(note);
  updateStatus();
  if(focusTitle){
    focusTitle=false;
    var t=el('titleInput');
    if(t){t.focus();t.select();}
  }
}

/* ── 操作 ──────────────────────────────────────────────────────────── */
function openTab(id){
  var t=null;
  for(var i=0;i<S.tabs.length;i++)if(S.tabs[i].id===id)t=S.tabs[i];
  if(!t){t={id:id,dirty:false};S.tabs.push(t);}
  S.active=id;S.jsonTree=false;
  renderTabs();renderEditor();renderList();
  saveState();
}
function closeTab(id){
  var i=-1;
  for(var k=0;k<S.tabs.length;k++)if(S.tabs[k].id===id){i=k;break;}
  if(i<0)return;
  S.tabs.splice(i,1);
  if(S.active===id){
    S.active=S.tabs.length?S.tabs[Math.min(i,S.tabs.length-1)].id:null;
    S.jsonTree=false;
    renderEditor();
  }
  renderTabs();renderList();
  saveState();
}
function newNote(){
  var id='n'+Date.now();
  NOTES.unshift({id:id,title:'无标题笔记',folder:'',tags:[],star:false,pin:false,time:'刚刚',body:''});
  S.filter={kind:'all'};
  focusTitle=true;
  openTab(id);
  renderSidebar();renderList();
  saveState();
}
function moveToTrash(id){
  var i=-1;
  for(var k=0;k<NOTES.length;k++)if(NOTES[k].id===id){i=k;break;}
  if(i<0)return;
  var n=NOTES.splice(i,1)[0];
  TRASH.unshift({id:n.id,title:n.title,time:'刚刚'});
  var ti=-1;
  for(var j=0;j<S.tabs.length;j++)if(S.tabs[j].id===id){ti=j;break;}
  if(ti>=0)S.tabs.splice(ti,1);
  if(S.active===id){S.active=S.tabs.length?S.tabs[Math.min(ti,S.tabs.length-1)].id:null;S.jsonTree=false;renderEditor();}
  renderTabs();renderList();renderSidebar();
  saveState();toast('已移到回收站');
}
function restoreNote(id){
  var i=-1;
  for(var k=0;k<TRASH.length;k++)if(TRASH[k].id===id){i=k;break;}
  if(i<0)return;
  var t=TRASH.splice(i,1)[0];
  NOTES.unshift({id:t.id,title:t.title,folder:'',tags:[],star:false,pin:false,time:'刚刚',body:''});
  renderList();renderSidebar();saveState();toast('已恢复');
}
function deleteForever(id){
  var i=-1;
  for(var k=0;k<TRASH.length;k++)if(TRASH[k].id===id){i=k;break;}
  if(i<0)return;
  TRASH.splice(i,1);
  renderList();renderSidebar();saveState();toast('已彻底删除');
}
function setMode(m){
  S.mode=m;S.jsonTree=false;
  renderEditor();
  saveState();
}
function setTheme(t){
  S.theme=t;
  document.documentElement.setAttribute('data-theme',t);
  el('icoMoon').classList.toggle('hidden',t==='dark');
  el('icoSun').classList.toggle('hidden',t==='light');
  var bs=document.querySelectorAll('#themeSeg .seg-mini-btn');
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-theme-pick')===t);
  saveState();
}
function toggleTheme(){setTheme(S.theme==='light'?'dark':'light');}
function formatAction(fmt){
  var ta=el('bodyInput');
  if(!ta)return;
  var s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e);
  var n=byId(S.active);
  if(fmt==='bold')ta.setRangeText('**'+(sel||'粗体文本')+'**',s,e,'end');
  else if(fmt==='italic')ta.setRangeText('*'+(sel||'斜体文本')+'*',s,e,'end');
  else if(fmt==='code')ta.setRangeText('`'+(sel||'代码')+'`',s,e,'end');
  else if(fmt==='link')ta.setRangeText('['+(sel||'链接文字')+'](https://)',s,e,'end');
  else if(fmt==='image')ta.setRangeText('!['+(sel||'图片描述')+'](图片地址)',s,e,'end');
  else linePrefix({h1:'# ',h2:'## ',list:'- ',quote:'> '}[fmt]||'');
  ta=el('bodyInput');
  if(n){n.body=ta.value;autoResize(ta);updatePreview(n);updateStatus();markDirty();}
}
function linePrefix(pf){
  var ta=el('bodyInput');
  if(!ta)return;
  var s=ta.selectionStart,v=ta.value;
  var ls=v.lastIndexOf('\n',s-1)+1;
  var le=v.indexOf('\n',s);if(le===-1)le=v.length;
  var line=v.slice(ls,le);
  var out=line.indexOf(pf)===0?line.slice(pf.length):pf+line;
  ta.setRangeText(out,ls,le,'end');
}
function formatJsonAction(){
  var note=byId(S.active);
  if(!note)return;
  var j=jsonOf(note),msg=el('jbMsg');
  if(!j||j.err){msg.className='jb-msg err';msg.textContent='无法格式化：JSON 无效';return;}
  var pretty=JSON.stringify(j.json,null,2);
  var m=note.body.match(/```json\s*\n[\s\S]*?\n```/);
  if(m)note.body=note.body.replace(m[0],'```json\n'+pretty+'\n```');
  else note.body=pretty;
  msg.className='jb-msg ok';msg.textContent='已格式化';
  renderEditor();markDirty();
}
function validateJsonAction(){
  var note=byId(S.active);
  if(!note)return;
  var j=jsonOf(note),msg=el('jbMsg');
  if(!j){msg.className='jb-msg err';msg.textContent='未检测到 JSON 内容';return;}
  if(!j.err){msg.className='jb-msg ok';msg.textContent='✓ JSON 格式有效';return;}
  var pos=0,mm=j.err.message.match(/position (\d+)/);
  if(mm)pos=parseInt(mm[1],10);
  var before=j.text.slice(0,pos).split('\n');
  msg.className='jb-msg err';
  msg.textContent='✗ 第 '+before.length+' 行，第 '+(before[before.length-1].length+1)+' 列：格式有误';
}
function treeAction(){S.jsonTree=!S.jsonTree;renderEditor();}
function expandAll(){
  var n=byId(S.active),j=n?jsonOf(n):null;
  if(!j||!j.json)return;
  var out=[];collectPaths(j.json,'$',out);
  S.expanded=new Set(out);
  var tr=document.querySelector('#content .jtree');
  if(tr)tr.innerHTML=buildTree(j.json,'$');
}
function collapseAll(){
  var n=byId(S.active),j=n?jsonOf(n):null;
  if(!j||!j.json)return;
  S.expanded=new Set();
  var tr=document.querySelector('#content .jtree');
  if(tr)tr.innerHTML=buildTree(j.json,'$');
}
function copyText(t,btn){
  var done=function(){
    if(btn){var sp=btn.querySelector('span');if(sp)sp.textContent='已复制';}
    toast('已复制到剪贴板');
  };
  var legacy=function(){
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(err){}
    ta.remove();done();
  };
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,legacy);}
  else legacy();
}

/* ── 事件 ──────────────────────────────────────────────────────────── */
function wire(){
  var si=el('searchInput');
  si.addEventListener('input',function(){S.q=this.value.trim();el('searchWrap').classList.toggle('has-q',!!S.q);renderList();});
  el('searchClear').addEventListener('click',function(){S.q='';si.value='';el('searchWrap').classList.remove('has-q');renderList();si.focus();});
  el('newNoteBtn').addEventListener('click',newNote);
  el('themeBtn').addEventListener('click',function(){
    toggleTheme();
    this.classList.remove('spin');void this.offsetWidth;this.classList.add('spin');
  });
  el('settingsBtn').addEventListener('click',function(e){e.stopPropagation();el('settingsPop').classList.toggle('open');});
  document.addEventListener('click',function(e){if(!e.target.closest('.settings-wrap'))el('settingsPop').classList.remove('open');});
  el('themeSeg').addEventListener('click',function(e){
    var b=e.target.closest('[data-theme-pick]');
    if(b)setTheme(b.getAttribute('data-theme-pick'));
  });
  el('aboutRow').addEventListener('click',function(){toast('记事本 v1.0 · 纯本地存储');});
  el('sideNav').addEventListener('click',function(e){
    var item=e.target.closest('[data-filter]');
    if(item){S.filter={kind:item.getAttribute('data-filter')};S.jsonTree=false;renderSidebar();renderList();renderEditor();saveState();return;}
    var fc=e.target.closest('.folder-child');
    if(fc){S.filter={kind:'folder',value:fc.getAttribute('data-fpath')};renderSidebar();renderList();saveState();return;}
    var f=e.target.closest('.folder-row[data-folder]');
    if(f){var name=f.getAttribute('data-folder');if(S.foldersOpen.has(name))S.foldersOpen.delete(name);else S.foldersOpen.add(name);renderSidebar();return;}
    var tp=e.target.closest('.tag-pill[data-tag]');
    if(tp){S.filter={kind:'tag',value:tp.getAttribute('data-tag')};renderSidebar();renderList();saveState();return;}
    var r=e.target.closest('.rail-item[data-rail]');
    if(r){S.rail=false;renderSidebar();}
  });
  el('sideFoot').addEventListener('click',function(e){
    var item=e.target.closest('[data-filter="trash"]');
    if(item){S.filter={kind:'trash'};S.jsonTree=false;renderSidebar();renderList();renderEditor();saveState();return;}
    var tg=e.target.closest('#sideToggle');
    if(tg){S.rail=!S.rail;renderSidebar();saveState();}
  });
  el('cards').addEventListener('click',function(e){
    var m=e.target.closest('.mini-btn');
    if(m){
      var act=m.getAttribute('data-act'),id=m.getAttribute('data-id'),n;
      if(act==='star'){n=byId(id);if(n){n.star=!n.star;renderList();saveState();}}
      else if(act==='pin'){n=byId(id);if(n){n.pin=!n.pin;renderList();saveState();}}
      else if(act==='trash')moveToTrash(id);
      else if(act==='restore')restoreNote(id);
      else if(act==='del')deleteForever(id);
      return;
    }
    var link=e.target.closest('.le-link');
    if(link){
      var a=link.getAttribute('data-act');
      if(a==='clearq'){S.q='';si.value='';el('searchWrap').classList.remove('has-q');renderList();}
      else if(a==='newnote')newNote();
      return;
    }
    var card=e.target.closest('.card');
    if(card)openTab(card.getAttribute('data-id'));
  });
  el('cards').addEventListener('keydown',function(e){
    if(e.key==='Enter'){var card=e.target.closest('.card');if(card)openTab(card.getAttribute('data-id'));}
  });
  el('tabbar').addEventListener('click',function(e){
    if(e.target.closest('#tabAdd')){newNote();return;}
    var x=e.target.closest('.tab-x');
    if(x){closeTab(x.getAttribute('data-close'));return;}
    var t=e.target.closest('.tab');
    if(t&&t.getAttribute('data-id')!==S.active)openTab(t.getAttribute('data-id'));
  });
  el('tabbar').addEventListener('keydown',function(e){
    if(e.key==='Enter'){var t=e.target.closest('.tab');if(t)openTab(t.getAttribute('data-id'));}
  });
  el('fmtGroup').addEventListener('click',function(e){
    var b=e.target.closest('[data-fmt]');
    if(b)formatAction(b.getAttribute('data-fmt'));
  });
  document.querySelector('.seg-wrap').addEventListener('click',function(e){
    var b=e.target.closest('[data-mode]');
    if(b)setMode(b.getAttribute('data-mode'));
  });
  el('jsonbar').addEventListener('click',function(e){
    var b=e.target.closest('.jb-btn');
    if(!b)return;
    var act=b.getAttribute('data-act');
    if(act==='fmt')formatJsonAction();
    else if(act==='validate')validateJsonAction();
    else if(act==='tree')treeAction();
  });
  el('content').addEventListener('click',function(e){
    var cp=e.target.closest('.cb-copy');
    if(cp){
      var blk=cp.closest('.codeblock'),code=blk?blk.querySelector('code'):null;
      if(code)copyText(code.textContent,cp);
      return;
    }
    var ct=e.target.closest('.jt-caret');
    if(ct){
      var p=ct.getAttribute('data-p');
      if(S.expanded.has(p))S.expanded.delete(p);else S.expanded.add(p);
      ct.classList.toggle('closed',!S.expanded.has(p));
      var sib=ct.parentNode.nextSibling;
      while(sib&&!(sib.classList&&sib.classList.contains('jt-children')))sib=sib.nextSibling;
      if(sib)sib.classList.toggle('closed',!S.expanded.has(p));
      return;
    }
    if(e.target.closest('#idleNew')){newNote();return;}
    if(e.target.closest('#jtExpandAll')){expandAll();return;}
    if(e.target.closest('#jtCollapseAll')){collapseAll();return;}
    if(e.target.closest('#jtBack')){S.jsonTree=false;renderEditor();return;}
  });
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==='n'){e.preventDefault();newNote();}
    else if((e.ctrlKey||e.metaKey)&&k==='f'){e.preventDefault();si.focus();}
    else if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();toast('已保存');}
    else if(e.key==='Escape'){
      if(S.q){S.q='';si.value='';el('searchWrap').classList.remove('has-q');renderList();}
    }
  });
}

/* ── 持久化 ────────────────────────────────────────────────────────── */
function saveState(){
  try{
    localStorage.setItem('np.v2',JSON.stringify({
      notes:NOTES.map(function(n){return {id:n.id,title:n.title,folder:n.folder,tags:n.tags,star:n.star,pin:n.pin,time:n.time,body:n.body};}),
      trash:TRASH,
      ui:{theme:S.theme,rail:S.rail,mode:S.mode,tabs:S.tabs,active:S.active,foldersOpen:Array.from(S.foldersOpen)}
    }));
  }catch(err){}
}
function loadState(){
  try{
    var d=JSON.parse(localStorage.getItem('np.v2')||'null');
    if(!d)return;
    if(d.notes&&d.notes.length){
      NOTES.length=0;
      d.notes.forEach(function(n){NOTES.push(n);});
    }
    if(d.trash)TRASH=d.trash;
    var u=d.ui||{};
    if(u.theme)S.theme=u.theme;
    S.rail=!!u.rail;
    if(u.mode)S.mode=u.mode;
    if(Array.isArray(u.tabs))S.tabs=u.tabs.filter(function(t){return byId(t.id);});
    if(u.active&&byId(u.active))S.active=u.active;
    if(u.foldersOpen)S.foldersOpen=new Set(u.foldersOpen);
  }catch(err){}
}

/* ── 启动 ──────────────────────────────────────────────────────────── */
loadState();
setTheme(S.theme);
renderSidebar();
renderList();
renderTabs();
renderEditor();
wire();
saveUI('saved');
})();
</script>
</body>
