<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记事本 · 前端界面原型</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   设计系统 tokens（Apple）— 逐字绑定
   ═══════════════════════════════════════════════════════════════════ */
:root {
  /* ─── Surface (3 levels) ────────────────────────────────────────── */
  --bg: #ffffff;
  --surface: #f5f5f7;
  --surface-warm: #fbfbfd;

  /* ─── Foreground ramp (4 levels) ───────────────────────────────── */
  --fg: #1d1d1f;
  --fg-2: #424245;
  --muted: #6e6e73;
  --meta: #86868b;

  /* ─── Border (2 levels) ────────────────────────────────────────── */
  --border: #d2d2d7;
  --border-soft: #e8e8ed;

  /* ─── Accent ────────────────────────────────────────────────────── */
  --accent: #0071e3;
  --accent-on: #ffffff; /* white label on the blue fill */

  /* ─── Accent states ─────────────────────────────────────────────── */
  --accent-hover: #0077ed;
  --accent-active: #0066cc;

  /* ─── Semantic ──────────────────────────────────────────────────── */
  --success: #16a34a;
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ────────────────────────────────────────────────── */
  --font-display:
    "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body:
    "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:
    "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale (px) — derived from DESIGN.md §3 hierarchy table. */
  --text-xs:   12px;   /* Micro UI — fine print, micro labels */
  --text-sm:   14px;   /* Control Label — buttons, helper labels */
  --text-base: 17px;   /* Body Primary — Apple's reading baseline */
  --text-lg:   21px;   /* Link/Action Heading — large promo links */
  --text-xl:   28px;   /* Card/Product Title — tile-level naming */
  --text-2xl:  40px;   /* Product Heading — campaign section titles */
  --text-3xl:  56px;   /* Hero Display L — homepage hero moments */
  --text-4xl:  80px;   /* Hero Display XL — Environment / store hero */

  --leading-body:  1.47;
  --leading-tight: 1.05;
  --tracking-display: -0.015em;

  /* ─── Spacing ───────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* ─── Section rhythm ────────────────────────────────────────────── */
  --section-y-desktop: 100px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  /* ─── Radius ────────────────────────────────────────────────────── */
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   18px;
  --radius-pill: 980px;

  /* ─── Elevation (3 levels) ──────────────────────────────────────── */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);

  /* ─── Focus ring ────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);

  /* ─── Motion ────────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);

  /* ─── Layout ────────────────────────────────────────────────────── */
  --container-max:            1024px;
  --container-gutter-desktop: 22px;
  --container-gutter-tablet:  18px;
  --container-gutter-phone:   16px;
}

/* ─── 派生组件变量（由 token 演算，双主题共享） ───────────────────── */
:root {
  color-scheme: light;
  --tint-1: color-mix(in srgb, var(--fg) 5%, transparent);
  --tint-2: color-mix(in srgb, var(--fg) 9%, transparent);
  --tint-3: color-mix(in srgb, var(--fg) 14%, transparent);
  --sel-bg: color-mix(in oklab, var(--accent) 10%, transparent);
  --sel-ring: color-mix(in oklab, var(--accent) 30%, transparent);
  --accent-bright: oklch(0.72 0.16 258);               /* 深色场景链接蓝 */
  --green: oklch(0.52 0.14 152);                       /* TXT 徽章文字 */
  --green-bg: color-mix(in oklab, oklch(0.52 0.14 152) 13%, transparent);
  --amber: oklch(0.78 0.15 75);                        /* 星标 / 未保存点 */
  --code-bg: #1d1d1f;                                  /* 石墨代码块 */
  --code-fg: #f5f5f7;
  --tok-c: #86868b; --tok-s: oklch(0.74 0.15 152); --tok-n: oklch(0.8 0.15 60);
  --tok-k: oklch(0.75 0.15 285);
  --glass: color-mix(in srgb, var(--bg) 78%, transparent);
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.06);
  --editor-font: var(--font-mono);
  --editor-size: 14px;
  --drag-active: #000;
}

/* ─── 深色主题（Apple 暗色阶：黑 → 石墨 → 近黑墨） ───────────────── */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1d1d1f;
  --surface: #161617;
  --surface-warm: #1a1a1c;
  --fg: #f5f5f7;
  --fg-2: #d2d2d7;
  --muted: #a1a1a6;
  --meta: #6e6e73;
  --border: #424245;
  --border-soft: #2a2a2c;
  --accent: #0071e3;
  --accent-on: #ffffff;
  --accent-hover: #0077ed;
  --accent-active: #0066cc;
  --tint-1: color-mix(in srgb, var(--fg) 7%, transparent);
  --tint-2: color-mix(in srgb, var(--fg) 12%, transparent);
  --tint-3: color-mix(in srgb, var(--fg) 18%, transparent);
  --sel-bg: color-mix(in oklab, var(--accent) 20%, transparent);
  --sel-ring: color-mix(in oklab, var(--accent) 45%, transparent);
  --green: oklch(0.72 0.16 152);
  --green-bg: color-mix(in oklab, oklch(0.72 0.16 152) 16%, transparent);
  --code-bg: #0b0b0c;
  --code-fg: #e8e8ed;
  --tok-c: #6e6e73; --tok-s: oklch(0.74 0.15 152); --tok-n: oklch(0.8 0.15 60);
  --tok-k: oklch(0.75 0.15 285);
  --glass: color-mix(in srgb, var(--surface) 82%, transparent);
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* ═══════════════════════════════════════════════════════════════════
   基础
   ═══════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5; color: var(--fg); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; user-select: text; }
svg { display: block; }
::selection { background: color-mix(in oklab, var(--accent) 24%, transparent); }
:focus { outline: none; }
:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-active); }
[data-theme="dark"] a { color: var(--accent-bright); }
[data-theme="dark"] a:hover { color: var(--accent); }
kbd {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2);
  background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 5px; white-space: nowrap;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg) 20%, transparent); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--fg) 34%, transparent); }
::-webkit-scrollbar-corner { background: transparent; }
.flex-spacer { flex: 1; }
[hidden] { display: none !important; }
.ic { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-fill { fill: currentColor; stroke: none; }
.vault-add-inline { display: flex; gap: 6px; margin-top: 12px; }
.vault-add-inline input {
  flex: 1; min-width: 0; height: 30px; padding: 0 10px; font-size: 13px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-warm);
}
.vault-add-inline input:focus-visible { border-color: var(--accent); box-shadow: var(--focus-ring); }
.vault-add-inline .mini-btn { width: 30px; height: 30px; border-radius: 8px; background: var(--tint-1); }
.vault-add-inline .mini-btn:hover { background: var(--tint-2); }

/* ═══════════════════════════════════════════════════════════════════
   应用骨架
   ═══════════════════════════════════════════════════════════════════ */
#app { display: flex; flex-direction: column; height: 100vh; }
#main { flex: 1; display: flex; min-height: 0; position: relative; }

/* ─── 标题栏 ─────────────────────────────────────────────────────── */
#titlebar {
  height: 46px; flex: none; display: flex; align-items: center; gap: 10px;
  padding-left: 12px; background: var(--glass);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--border-soft); z-index: 60;
}
#vault-switcher {
  display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
  border-radius: var(--radius-sm); color: var(--fg); font-size: 13px; font-weight: 600;
  transition: background var(--motion-fast) var(--ease-standard);
}
#vault-switcher:hover { background: var(--tint-2); }
#vault-switcher .ic { width: 15px; height: 15px; color: var(--muted); }
#vault-switcher .chev { width: 12px; height: 12px; color: var(--muted); transition: transform var(--motion-fast) var(--ease-standard); }
#vault-switcher[aria-expanded="true"] .chev, #vault-switcher-side[aria-expanded="true"] .chev { transform: rotate(180deg); }
#titlebar-center { flex: 1; display: flex; justify-content: center; min-width: 0; }
.search-wrap { position: relative; width: min(380px, 100%); max-width: 380px; }
#search-field {
  width: 100%; height: 30px; padding: 0 30px 0 30px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--fg);
  font-size: 13px; transition: border-color var(--motion-fast), background var(--motion-fast);
}
#search-field::placeholder { color: var(--muted); }
#search-field:hover { border-color: var(--meta); }
#search-field:focus-visible { border-color: var(--accent); box-shadow: var(--focus-ring); background: var(--bg); }
.search-ic { position: absolute; left: 9px; top: 7px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search-kbd { position: absolute; right: 7px; top: 6px; pointer-events: none; opacity: .9; }
.search-clear {
  position: absolute; right: 6px; top: 5px; width: 20px; height: 20px; border-radius: 6px;
  display: none; align-items: center; justify-content: center; color: var(--muted);
}
.search-clear:hover { background: var(--tint-2); color: var(--fg); }
.search-wrap.has-q .search-clear { display: flex; }
.search-wrap.has-q .search-kbd { display: none; }
#titlebar-right { display: flex; align-items: center; gap: 4px; padding-right: 0; }
.tb-btn {
  width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: var(--fg-2); transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast);
}
.tb-btn:hover { background: var(--tint-2); color: var(--fg); }
.tb-btn .ic { width: 15px; height: 15px; }
.btn-new {
  display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; margin-right: 2px;
  border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-on);
  font-size: 13px; font-weight: 600; transition: background var(--motion-fast) var(--ease-standard);
}
.btn-new:hover { background: var(--accent-hover); }
.btn-new:active { background: var(--accent-active); }
.btn-new .ic { width: 13px; height: 13px; }
.btn-new .chev { width: 11px; height: 11px; opacity: .85; transition: transform var(--motion-fast); }
.btn-new[aria-expanded="true"] .chev { transform: rotate(180deg); }
.titlebar-sep { width: 1px; height: 20px; background: var(--border-soft); margin: 0 4px; }
.win-btn {
  width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--fg-2); transition: background var(--motion-fast);
}
.win-btn:hover { background: var(--tint-2); color: var(--fg); }
.win-btn .ic { width: 14px; height: 14px; }
.win-close:hover { background: #c42b1c; color: #fff; }

/* ─── 菜单（毛玻璃浮层） ─────────────────────────────────────────── */
.menu {
  position: fixed; z-index: 120; min-width: 210px; max-width: 340px;
  background: var(--glass); backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-pop); padding: 5px;
  opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top left;
  transition: opacity var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
  pointer-events: none;
}
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu-item {
  display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 9px;
  border-radius: 7px; font-size: 13px; color: var(--fg); text-align: left;
  transition: background var(--motion-fast);
}
.menu-item:hover { background: var(--tint-2); }
.menu-item .m-ic { width: 15px; height: 15px; color: var(--muted); flex: none; }
.menu-item .m-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .m-hint { font-size: 11px; color: var(--muted); white-space: nowrap; }
.menu-item .m-check { width: 14px; height: 14px; color: var(--accent); flex: none; }
.menu-item.danger { color: var(--danger); }
.menu-item.danger .m-ic { color: var(--danger); }
.menu-divider { height: 1px; background: var(--border-soft); margin: 5px 8px; }
.menu-title { font-size: 11px; color: var(--muted); padding: 7px 10px 4px; font-weight: 500; }

/* ─── 侧栏 ───────────────────────────────────────────────────────── */
#sidebar {
  width: 252px; flex: none; display: flex; flex-direction: column; background: var(--surface);
  border-right: 1px solid var(--border-soft); min-height: 0;
  transition: width var(--motion-base) var(--ease-standard);
}
#vault-block { padding: 8px 8px 6px; border-bottom: 1px solid var(--border-soft); }
#vault-switcher.vs-side {
  width: 100%; justify-content: flex-start; background: var(--tint-1);
}
#vault-switcher.vs-side:hover { background: var(--tint-2); }
#vault-switcher .vs-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#vault-add-row { display: none; padding: 8px; border-bottom: 1px solid var(--border-soft); gap: 6px; }
#vault-add-row.open { display: flex; }
#vault-add-row input {
  flex: 1; min-width: 0; height: 28px; padding: 0 8px; font-size: 13px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg);
}
#vault-add-row input:focus-visible { border-color: var(--accent); box-shadow: var(--focus-ring); }
.mini-btn { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.mini-btn:hover { background: var(--tint-2); color: var(--fg); }
.mini-btn .ic { width: 13px; height: 13px; }
.nav-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 0 10px; }
.nav-group-label {
  font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .05em;
  padding: 14px 14px 5px;
}
.nav-row {
  display: flex; align-items: center; gap: 8px; height: 30px; margin: 0 8px 1px; padding: 0 9px;
  border-radius: 8px; font-size: 13px; color: var(--fg); width: calc(100% - 16px);
  transition: background var(--motion-fast) var(--ease-standard);
}
.nav-row:hover { background: var(--tint-1); }
.nav-row .ic { width: 15px; height: 15px; color: var(--muted); }
.nav-row .n-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.nav-row .n-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-row.sel { background: var(--sel-bg); font-weight: 600; }
.nav-row.sel .ic { color: var(--accent); }
.nav-row.sel .n-count { color: var(--fg-2); }
[data-theme="dark"] .nav-row.sel .ic { color: var(--accent-bright); }
.folder-row { padding-left: 6px; }
.folder-row .f-caret { width: 14px; height: 14px; color: var(--meta); transition: transform var(--motion-fast) var(--ease-standard); flex: none; }
.folder-row .f-caret.open { transform: rotate(90deg); }
.folder-row .ic { width: 14px; height: 14px; }
.folder-row .f-badges { display: flex; gap: 4px; flex: none; }
.f-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .02em; padding: 1px 4px; border-radius: 4px;
  font-family: var(--font-mono);
}
.f-badge.md { color: var(--accent-active); background: color-mix(in oklab, var(--accent) 12%, transparent); }
.f-badge.txt { color: var(--green); background: var(--green-bg); }
[data-theme="dark"] .f-badge.md { color: var(--accent-bright); }
.leaf-row { height: 27px; padding-left: 29px; font-size: 12.5px; }
.leaf-row .ic { width: 13px; height: 13px; }
.leaf-row .f-badge { font-size: 9px; padding: 0 3px; }
.tag-row { gap: 8px; }
.tag-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tag-dot.blue { background: oklch(0.62 0.19 255); }
.tag-dot.indigo { background: oklch(0.58 0.18 285); }
.tag-dot.cyan { background: oklch(0.7 0.13 220); }
.tag-dot.red { background: oklch(0.62 0.2 25); }
.tag-dot.orange { background: oklch(0.74 0.16 55); }
.tag-dot.green { background: oklch(0.7 0.16 150); }
.tag-dot.purple { background: oklch(0.58 0.2 305); }
.tag-dot.pink { background: oklch(0.66 0.17 350); }
.tag-dot.yellow { background: oklch(0.8 0.14 90); }
.sidebar-foot { border-top: 1px solid var(--border-soft); padding: 6px 0 8px; }
.rail-toggle { width: 28px; height: 28px; margin: 4px 8px 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 7px; color: var(--muted); }
.rail-toggle:hover { background: var(--tint-2); color: var(--fg); }
.rail-toggle .ic { width: 15px; height: 15px; }

/* 折叠 rail 模式 */
#app.rail #sidebar { width: 52px; }
#app.rail #vault-block { display: none; }
#app.rail .nav-scroll { overflow: visible; }
#app.rail .nav-group-label, #app.rail .n-label, #app.rail .n-count,
#app.rail .f-caret, #app.rail .f-badges, #app.rail .tag-dot, #app.rail .f-badge,
#app.rail #folder-tree, #app.rail #tag-list { display: none; }
#app.rail .nav-row { width: 36px; margin: 0 8px 2px; padding: 0; justify-content: center; }
#app.rail .rail-toggle { margin: 4px 12px 0; }
.tip { position: relative; }
.tip::after {
  content: attr(data-tip); position: absolute; left: 44px; top: 50%; transform: translateY(-50%) translateX(-4px);
  background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 500; white-space: nowrap;
  padding: 4px 9px; border-radius: 6px; opacity: 0; pointer-events: none;
  transition: opacity var(--motion-fast) var(--ease-standard) .1s, transform var(--motion-fast) var(--ease-standard) .1s;
  z-index: 90; box-shadow: var(--elev-raised);
}
.tip:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }

/* ─── 笔记列表 ───────────────────────────────────────────────────── */
#listpane {
  width: 320px; flex: none; display: flex; flex-direction: column; background: var(--surface-warm);
  border-right: 1px solid var(--border-soft); min-height: 0;
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
}
#listpane.switching { opacity: 0; transform: translateY(3px); }
#list-header { padding: 12px 12px 8px; border-bottom: 1px solid var(--border-soft); }
.lh-row1 { display: flex; align-items: center; gap: 8px; }
#list-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list-count {
  font-size: 11px; color: var(--accent-active); background: color-mix(in oklab, var(--accent) 11%, transparent);
  padding: 1px 7px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums;
}
[data-theme="dark"] #list-count { color: var(--accent-bright); }
.lh-tools { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.seg { display: flex; background: var(--tint-1); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg-btn {
  height: 24px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--muted);
  display: flex; align-items: center; gap: 5px; transition: background var(--motion-fast), color var(--motion-fast), box-shadow var(--motion-fast);
}
.seg-btn .ic { width: 13px; height: 13px; }
.seg-btn.sel { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
[data-theme="dark"] .seg-btn.sel { box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.sort-btn {
  height: 28px; padding: 0 9px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--muted); border: 1px solid transparent; transition: background var(--motion-fast), border-color var(--motion-fast);
}
.sort-btn:hover { background: var(--tint-1); border-color: var(--border); color: var(--fg); }
.sort-btn .ic { width: 13px; height: 13px; }
.trash-clear { margin-left: auto; font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.trash-clear:hover { background: var(--tint-2); color: var(--danger); }
#note-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px; }
#note-list.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
#note-list:not(.grid) .card + .card { margin-top: 2px; }
.card {
  position: relative; border-radius: 10px; padding: 9px 10px 8px; cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.card:hover { background: var(--tint-1); }
.card.sel { background: var(--sel-bg); }
.card.sel::after {
  content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 22%, transparent);
}
.card-head { display: flex; align-items: center; gap: 6px; min-height: 17px; }
.card-tags { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.card-tag {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted);
  background: var(--tint-1); border-radius: 5px; padding: 1px 5px; white-space: nowrap;
}
.card-tag .tag-dot { width: 6px; height: 6px; }
.card-head .mini-btn { opacity: 0; transition: opacity var(--motion-fast); }
.card:hover .card-head .mini-btn, .card.sel .card-head .mini-btn { opacity: 1; }
.mini-btn.on { opacity: 1 !important; color: var(--amber); }
.mini-btn.on:hover { color: var(--amber); background: color-mix(in oklab, var(--amber) 16%, transparent); }
.card-title {
  font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; margin-top: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35;
}
.card-ex {
  font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.card-foot .fdot { color: var(--meta); }
.card-foot .hover-acts { display: flex; gap: 2px; opacity: 0; transition: opacity var(--motion-fast); }
.card:hover .card-foot .hover-acts, .card.sel .card-foot .hover-acts { opacity: 1; }
.badge {
  display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: .03em;
  padding: 1.5px 5px; border-radius: 5px; font-family: var(--font-mono); flex: none;
}
.badge.md { color: var(--accent-active); background: color-mix(in oklab, var(--accent) 12%, transparent); }
.badge.txt { color: var(--green); background: var(--green-bg); }
[data-theme="dark"] .badge.md { color: var(--accent-bright); }
mark.hl { background: color-mix(in oklab, var(--accent) 20%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
#list-empty { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
#list-empty.show { display: flex; }
#list-empty .le-ic {
  width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  background: var(--tint-1); color: var(--muted); margin-bottom: 2px;
}
#list-empty .le-ic .ic { width: 24px; height: 24px; }
#list-empty .le-title { font-size: 14px; font-weight: 600; }
#list-empty .le-sub { font-size: 12.5px; color: var(--muted); max-width: 240px; line-height: 1.55; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; margin-top: 4px;
  border-radius: var(--radius-pill); background: var(--tint-2); color: var(--fg); font-size: 12.5px; font-weight: 500;
  transition: background var(--motion-fast);
}
.btn-ghost:hover { background: var(--tint-3); }
.btn-ghost .ic { width: 13px; height: 13px; }

/* ─── 编辑区 ─────────────────────────────────────────────────────── */
#editorpane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
#tabbar {
  height: 41px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0;
  background: var(--surface-warm); border-bottom: 1px solid var(--border-soft); overflow: hidden;
}
.tab {
  position: relative; display: flex; align-items: center; gap: 7px; height: 34px; max-width: 210px; min-width: 0;
  padding: 0 8px 0 12px; border-radius: 9px 9px 0 0; font-size: 12.5px; color: var(--muted);
  border: 1px solid transparent; border-bottom: 0; flex: 0 1 auto;
  transition: background var(--motion-fast), color var(--motion-fast);
}
.tab:hover { background: var(--tint-1); color: var(--fg); }
.tab.sel { background: var(--bg); color: var(--fg); font-weight: 600; border-color: var(--border-soft); }
.tab .t-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .t-type { width: 13px; height: 13px; flex: none; }
.tab .t-type.md { color: var(--accent); }
.tab .t-type.txt { color: var(--green); }
.tab .t-close { width: 18px; height: 18px; border-radius: 5px; display: none; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.tab:hover .t-close, .tab.sel .t-close { display: flex; }
.tab .t-close:hover { background: var(--tint-3); color: var(--fg); }
.tab .t-close .ic { width: 11px; height: 11px; }
.tab .t-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; }
.tab-new {
  width: 30px; height: 30px; margin: 0 2px 2px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--muted); flex: none;
}
.tab-new:hover { background: var(--tint-2); color: var(--fg); }
.tab-new .ic { width: 14px; height: 14px; }
#tab-scroll { flex: 1; display: flex; align-items: flex-end; gap: 2px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; min-width: 0; }
#tab-scroll::-webkit-scrollbar { display: none; }

#editor-toolbar {
  height: 38px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px;
  border-bottom: 1px solid var(--border-soft); background: var(--bg);
}
.tool-btn {
  width: 27px; height: 27px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: var(--fg-2); transition: background var(--motion-fast), color var(--motion-fast);
}
.tool-btn:hover { background: var(--tint-2); color: var(--fg); }
.tool-btn .ic { width: 14px; height: 14px; }
.tool-sep { width: 1px; height: 16px; background: var(--border-soft); margin: 0 5px; }
.toolbar-hint { font-size: 11.5px; color: var(--muted); padding: 0 6px; }
#mode-toggle { margin-left: auto; }
#json-toolbar {
  height: 0; overflow: hidden; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px;
  background: color-mix(in oklab, var(--accent) 6%, transparent); border-bottom: 0 solid transparent;
  transition: height var(--motion-base) var(--ease-standard), padding var(--motion-base) var(--ease-standard);
}
#json-toolbar.open { height: 36px; padding: 0 10px; border-bottom-width: 1px; border-bottom-color: color-mix(in oklab, var(--accent) 18%, transparent); }
#json-toolbar .jt-label {
  display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--accent-active);
  margin-right: 6px; white-space: nowrap;
}
[data-theme="dark"] #json-toolbar .jt-label { color: var(--accent-bright); }
#json-toolbar .jt-label .ic { width: 13px; height: 13px; }
.json-tool {
  height: 25px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--fg-2);
  border: 1px solid var(--border); background: var(--bg); transition: background var(--motion-fast), border-color var(--motion-fast);
}
.json-tool:hover { background: var(--tint-1); border-color: var(--meta); }
.json-tool.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
#editor-body { flex: 1; display: flex; min-height: 0; position: relative; }
#editor-gutter {
  width: 52px; flex: none; overflow: hidden; padding: 14px 0 24px; background: var(--bg);
  border-right: 1px solid var(--border-soft); text-align: right;
}
#gutter-nums { font-family: var(--editor-font); font-size: var(--editor-size); line-height: 1.6; color: var(--meta); padding-right: 10px; }
#editor-area {
  flex: 1; min-width: 0; border: 0; resize: none; background: var(--bg); color: var(--fg);
  font-family: var(--editor-font); font-size: var(--editor-size); line-height: 1.6;
  padding: 14px 18px 60px; tab-size: 4; white-space: pre; overflow-wrap: normal; overflow: auto;
}
#editor-area.wrap { white-space: pre-wrap; overflow-wrap: break-word; }
#editor-area::placeholder { color: var(--meta); }
#editor-preview {
  flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; background: var(--bg);
  border-left: 1px solid var(--border-soft); padding: 18px 22px 80px;
}
#editor-preview.center { max-width: 780px; margin: 0 auto; border-left: 0; width: 100%; }
#split-drag {
  width: 5px; flex: none; cursor: col-resize; background: transparent; position: relative; z-index: 5;
  transition: background var(--motion-fast);
}
#split-drag:hover, #split-drag.dragging { background: color-mix(in oklab, var(--accent) 35%, transparent); }

/* 编辑区空状态 */
#editor-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--bg); }
#editor-empty .ee-ic { width: 56px; height: 56px; border-radius: 18px; background: var(--tint-1); display: flex; align-items: center; justify-content: center; color: var(--muted); }
#editor-empty .ee-ic .ic { width: 26px; height: 26px; }
#editor-empty .ee-title { font-size: 15px; font-weight: 600; margin-top: 4px; }
#editor-empty .ee-sub { font-size: 12.5px; color: var(--muted); }
#editor-empty .ee-kbd { display: flex; gap: 14px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }

/* 状态栏 */
#statusbar {
  height: 27px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px;
  background: var(--surface-warm); border-top: 1px solid var(--border-soft); font-size: 11.5px; color: var(--muted);
  user-select: none;
}
.sb-save { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.sb-save .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.sb-save.saved .dot { background: var(--green); }
.sb-save.saved { color: var(--fg-2); }
.sb-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.sb-toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.sb-toggle:hover { background: var(--tint-1); color: var(--fg); }
.sb-lang {
  font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 5px;
  color: var(--fg-2); background: var(--tint-1); font-family: var(--font-mono);
}
.sb-lang.json { color: var(--accent-active); background: color-mix(in oklab, var(--accent) 12%, transparent); }
[data-theme="dark"] .sb-lang.json { color: var(--accent-bright); }
#sb-pos { font-variant-numeric: tabular-nums; color: var(--meta); }

/* ─── Markdown 预览排版 ─────────────────────────────────────────── */
.md { font-size: 15px; line-height: 1.75; color: var(--fg); }
.md h1, .md h2, .md h3, .md h4 {
  font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin: 26px 0 10px;
}
.md h1 { font-size: 24px; margin-top: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border-soft); }
.md h2 { font-size: 19px; margin-top: 30px; }
.md h3 { font-size: 16px; margin-top: 24px; }
.md p { margin: 10px 0; text-wrap: pretty; }
.md ul, .md ol { margin: 10px 0; padding-left: 24px; }
.md li { margin: 4px 0; }
.md li.task { list-style: none; margin-left: -20px; display: flex; align-items: flex-start; gap: 9px; }
.md li.task input { margin-top: 5px; accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex: none; }
.md li.task.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
.md strong { font-weight: 700; }
.md em { font-style: italic; }
.md code {
  font-family: var(--font-mono); font-size: .86em; background: var(--tint-1); color: var(--fg);
  border-radius: 5px; padding: 1.5px 5px;
}
.md blockquote {
  margin: 12px 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--border);
  color: var(--fg-2);
}
.md blockquote p { margin: 6px 0; }
.md hr { border: 0; border-top: 1px solid var(--border-soft); margin: 22px 0; }
.md a { color: var(--accent); }
.md a:hover { text-decoration: underline; }
.md table { border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 13.5px; }
.md th, .md td { border: 1px solid var(--border-soft); padding: 7px 12px; text-align: left; }
.md th { background: var(--surface); font-weight: 600; font-size: 12.5px; }
.md tr:nth-child(even) td { background: color-mix(in srgb, var(--fg) 1.5%, transparent); }
.md .codeblock { margin: 14px 0; background: var(--code-bg); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--elev-raised); }
.md .cb-head {
  display: flex; align-items: center; height: 32px; padding: 0 8px 0 14px;
  border-bottom: 1px solid color-mix(in srgb, #fff 8%, transparent);
}
.md .cb-lang { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: color-mix(in srgb, var(--code-fg) 55%, transparent); text-transform: uppercase; }
.md .cb-copy {
  margin-left: auto; display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: 6px; font-size: 11px; color: color-mix(in srgb, var(--code-fg) 70%, transparent);
  transition: background var(--motion-fast), color var(--motion-fast);
}
.md .cb-copy:hover { background: rgba(255,255,255,.1); color: #fff; }
.md .cb-copy .ic { width: 12px; height: 12px; }
.md .codeblock pre { padding: 13px 16px; overflow-x: auto; }
.md .codeblock code {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65; color: var(--code-fg);
  background: none; padding: 0; white-space: pre; display: block;
}
.tok-c { color: var(--tok-c); font-style: italic; }
.tok-s { color: var(--tok-s); }
.tok-n { color: var(--tok-n); }
.tok-k { color: var(--tok-k); }
.md .math-fb {
  display: inline-block; font-family: var(--font-mono); font-size: .85em; color: var(--fg-2);
  background: var(--tint-1); border-radius: 6px; padding: 2px 8px; margin: 2px 0;
}
.md .math-fb.block { display: block; text-align: center; padding: 10px; }
.md .katex-display { margin: 14px 0; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.md .katex { font-size: 1.06em; }
.md .img-chip {
  display: inline-flex; align-items: center; gap: 10px; background: var(--surface);
  border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 8px 14px;
  color: var(--muted); font-size: 12.5px; margin: 4px 0;
}
.md .img-chip .ic { width: 18px; height: 18px; color: var(--meta); }
.md .img-chip-name { font-weight: 600; color: var(--fg-2); font-family: var(--font-mono); font-size: 12px; }
.md .img-chip-sub { color: var(--muted); font-size: 11.5px; }
.md pre.txt {
  font-family: var(--font-mono); font-size: 13px; line-height: 1.8; white-space: pre-wrap;
  word-break: break-word; background: none;
}

/* ─── JSON 抽屉 ──────────────────────────────────────────────────── */
#json-drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: 330px; z-index: 40;
  background: var(--bg); border-left: 1px solid var(--border); box-shadow: var(--shadow-pop);
  transform: translateX(102%); transition: transform var(--motion-base) var(--ease-standard);
  display: flex; flex-direction: column;
}
#json-drawer.open { transform: translateX(0); }
.jd-head { height: 42px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border-soft); }
.jd-head .jd-title { font-size: 13px; font-weight: 600; flex: 1; }
.jd-head .jd-title small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 11px; }
.jd-tool { height: 25px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; color: var(--fg-2); border: 1px solid var(--border); }
.jd-tool:hover { background: var(--tint-1); }
.jd-body { flex: 1; overflow: auto; padding: 8px 10px 30px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; }
.jrow { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; border-radius: 5px; padding: 1px 4px; }
.jrow:hover { background: var(--tint-1); }
.jrow .jt { width: 12px; height: 12px; color: var(--meta); transform: rotate(-90deg); transition: transform var(--motion-fast); align-self: center; flex: none; cursor: pointer; }
.jrow.open .jt { transform: rotate(0); }
.jrow .jkey { color: var(--fg); }
.jrow .jcolon { color: var(--meta); }
.jrow .jtype { font-size: 10.5px; color: var(--meta); }
.jrow .jval-s { color: var(--green); }
.jrow .jval-n { color: var(--tok-n); }
.jrow .jval-b { color: var(--tok-k); }
.jrow .jval-z { color: var(--meta); font-style: italic; }
.jrow .jval-str { color: var(--muted); font-size: 11px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }

/* ─── 弹层：欢迎页 / 设置 ────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--fg) 22%, transparent);
  backdrop-filter: blur(18px) saturate(130%); -webkit-backdrop-filter: blur(18px) saturate(130%);
  opacity: 0; pointer-events: none; transition: opacity var(--motion-base) var(--ease-standard);
}
.overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  width: min(600px, calc(100vw - 48px)); max-height: min(680px, calc(100vh - 64px));
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop); display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(8px) scale(.985); transition: transform var(--motion-base) var(--ease-standard);
}
.overlay.open .sheet { transform: none; }
.sheet-head { display: flex; align-items: center; padding: 18px 22px 14px; gap: 12px; }
.sheet-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
.sheet-body { padding: 0 22px 22px; overflow-y: auto; }
.app-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: var(--elev-raised); flex: none; }
.app-icon svg { width: 26px; height: 26px; }
.wl-sub { font-size: 13px; color: var(--muted); margin: -2px 0 14px; }
.vault-list { display: flex; flex-direction: column; gap: 6px; }
.vault-opt {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left;
  border: 1px solid var(--border-soft); border-radius: var(--radius-md); background: var(--bg);
  transition: border-color var(--motion-fast), background var(--motion-fast), box-shadow var(--motion-fast);
}
.vault-opt:hover { border-color: var(--meta); background: var(--surface-warm); }
.vault-opt .vo-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--tint-1); display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.vault-opt .vo-ic .ic { width: 17px; height: 17px; }
.vault-opt .vo-name { font-size: 14px; font-weight: 600; }
.vault-opt .vo-meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; font-family: var(--font-mono); }
.vault-opt .vo-count { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.vault-opt .vo-go { width: 16px; height: 16px; color: var(--meta); }
.wl-actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
.wl-actions .btn-ghost { margin-top: 0; }
.wl-note { margin-top: 14px; font-size: 11px; color: var(--meta); display: flex; align-items: center; gap: 6px; }
.wl-note .ic { width: 12px; height: 12px; }
#welcome .sheet-body { padding-bottom: 20px; }

/* 设置 */
#settings-modal .sheet { width: min(640px, calc(100vw - 48px)); height: min(520px, calc(100vh - 80px)); }
.set-body { display: flex; flex: 1; min-height: 0; }
.set-nav { width: 150px; flex: none; border-right: 1px solid var(--border-soft); padding: 10px 8px; }
.set-nav-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; margin-bottom: 2px;
  border-radius: 8px; font-size: 13px; color: var(--fg-2); text-align: left;
}
.set-nav-btn:hover { background: var(--tint-1); color: var(--fg); }
.set-nav-btn.sel { background: var(--sel-bg); color: var(--fg); font-weight: 600; }
.set-nav-btn .ic { width: 14px; height: 14px; color: var(--muted); }
.set-nav-btn.sel .ic { color: var(--accent); }
[data-theme="dark"] .set-nav-btn.sel .ic { color: var(--accent-bright); }
.set-pane { flex: 1; overflow-y: auto; padding: 18px 22px; }
.set-group { margin-bottom: 22px; }
.set-group h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.set-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.set-row label { flex: 1; font-size: 13px; color: var(--fg); }
.set-row .set-desc { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.set-row select, .set-row input[type="text"] {
  height: 30px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); font-size: 13px; color: var(--fg); min-width: 170px;
}
.set-row select:focus-visible, .set-row input[type="text"]:focus-visible { border-color: var(--accent); box-shadow: var(--focus-ring); }
.set-row input[type="range"] { accent-color: var(--accent); width: 160px; }
.set-size-val { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
.font-preview {
  margin-top: 4px; padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  background: var(--surface-warm); font-size: 13px; line-height: 1.9; color: var(--fg-2);
}
.set-vault-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-md); margin-bottom: 6px; background: var(--bg); }
.set-vault-row .sv-name { font-size: 13px; font-weight: 600; min-width: 70px; }
.set-vault-row .sv-path { font-size: 11px; color: var(--muted); font-family: var(--font-mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-vault-row .sv-count { font-size: 11px; color: var(--muted); white-space: nowrap; }
.text-btn { font-size: 12px; color: var(--accent); padding: 4px 8px; border-radius: 6px; }
.text-btn:hover { background: var(--tint-1); }
.text-btn.danger { color: var(--danger); }
.about-block { text-align: center; padding: 14px 0 4px; }
.about-block .app-icon { margin: 0 auto 12px; width: 56px; height: 56px; border-radius: 14px; }
.about-block .app-icon svg { width: 32px; height: 32px; }
.about-block h3 { font-size: 16px; font-weight: 700; }
.about-ver { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
.about-desc { font-size: 12.5px; color: var(--fg-2); margin: 12px auto; max-width: 380px; line-height: 1.7; }
.about-links { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }

/* ─── Toast ──────────────────────────────────────────────────────── */
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px; background: var(--fg); color: var(--bg);
  font-size: 12.5px; font-weight: 500; padding: 8px 15px; border-radius: var(--radius-pill);
  box-shadow: var(--shadow-pop); opacity: 0; transform: translateY(10px) scale(.97);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
  max-width: 420px;
}
.toast.show { opacity: 1; transform: none; }
.toast .ic { width: 13px; height: 13px; color: var(--accent-bright); }
.toast.err .ic { color: var(--danger); }
[data-theme="dark"] .toast { background: var(--fg); color: var(--bg); }

/* ─── 纯净模式 ───────────────────────────────────────────────────── */
#app.clean #sidebar, #app.clean #listpane { display: none; }
#app.clean .tb-clean { background: var(--sel-bg); color: var(--accent); }

/* ─── 响应式（桌面应用降级） ──────────────────────────────────────── */
@media (max-width: 1180px) {
  #listpane { width: 290px; }
  .search-wrap { width: 260px; }
}
@media (max-width: 1020px) {
  #sidebar { width: 220px; }
  #app.rail #sidebar { width: 52px; }
  .btn-new span { display: none; }
  .btn-new { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

  <!-- ─── 标题栏 ─── -->

        </button>

      </div>
    </aside>

    <!-- ─── 笔记列表 ─── -->
    <section id="listpane" data-od-id="listpane">
      <div id="list-header" data-od-id="list-header">
        <div class="lh-row1">
          <h2 id="list-title">全部笔记</h2>
          <span id="list-count">0</span>
        </div>
        <div class="lh-tools" id="lh-tools">
          <button class="sort-btn" id="sort-btn" data-action="sort-menu" aria-haspopup="menu" data-od-id="sort-menu">
            <svg class="ic"><use href="#i-clock"/></svg><span id="sort-label">按修改时间</span><svg class="ic" style="width:11px;height:11px"><use href="#i-chev-d"/></svg>
          </button>
          <span class="flex-spacer"></span>

## 特征值与特征向量

对于 $n \\times n$ 矩阵 $A$，若存在非零向量 $\\mathbf{v}$ 与标量 $\\lambda$ 满足：

$$ A\\mathbf{v} = \\lambda \\mathbf{v} $$

则称 $\\lambda$ 为 $A$ 的特征值，$\\mathbf{v}$ 为对应的特征向量。

## 矩阵乘法

$$ (AB)_{ij} = \\sum_{k=1}^{n} A_{ik} B_{kj} $$

## 向量的点积

$$ \\mathbf{a} \\cdot \\mathbf{b} = \\|\\mathbf{a}\\| \\|\\mathbf{b}\\| \\cos \\theta $$

## 常见结论

- 实对称矩阵的特征值均为实数
- 不同特征值对应的特征向量线性无关
- $\\mathrm{tr}(A) = \\sum_{i} \\lambda_i$，$\\det(A) = \\prod_{i} \\lambda_i$` },

/* ═══════════════════════════════════════════════════════════════════

const noteById = (id) => NOTES.find(n => n.id === id);
const vaultById = (id) => VAULTS.find(v => v.id === id);
const vaultNotes = (vid, includeTrash) => NOTES.filter(n => n.vault === vid && (includeTrash || !n.trashed));
const tagColor = (t) => TAG_COLOR[t] || 'blue';
const tagDotCls = (t) => {
  let c = tagColor(t);
  if (TAG_COLOR_FALLBACK[c]) c = TAG_COLOR_FALLBACK[c];
  return c;

function relTime(ts) {
  const d = now - ts;
  if (d < MIN) return '刚刚';
  if (d < HOUR) return Math.floor(d / MIN) + ' 分钟前';
  if (d < DAY) return Math.floor(d / HOUR) + ' 小时前';
  if (d < 2 * DAY) return '昨天';
  if (d < 7 * DAY) return Math.floor(d / DAY) + ' 天前';
  if (d < 30 * DAY) return Math.floor(d / (7 * DAY)) + ' 周前';
  if (d < 365 * DAY) return Math.floor(d / (30 * DAY)) + ' 个月前';
  return Math.floor(d / (365 * DAY)) + ' 年前';
}

function wordCount(content) {
  const han = (content.match(/\p{Script=Han}/gu) || []).length;
  const latin = (content.match(/[A-Za-z0-9_]+/g) || []).length;
  return han + latin;
}

function excerptOf(content) {
  let t = content
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/\$\$[\s\S]*?\$\$|\$[^$\n]*?\$/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[#>*_`|~-]/g, ' ')
    .replace(/\s+/g, ' ').trim();
  return t || '空白笔记';
}

function detectJson(content) {
  const t = content.trim();
  if (!/^[{[]/.test(t)) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

function fmtTime(ts) {
  const d = new Date(ts);
  const p = (x) => String(x).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark class="hl">$1</mark>');
}

function icon(name, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '"><use href="#i-' + name + '"/></svg>'; }

/* ═══════════════════════════════════════════════════════════════════
   迷你 Markdown 渲染（含语法高亮与 KaTeX 公式）
   ═══════════════════════════════════════════════════════════════════ */
const KEYWORDS = {
  js: /\b(const|let|var|function|return|if|else|for|while|async|await|new|class|import|from|export|try|catch|throw|typeof|of|in|this|null|undefined|true|false|require|module|process)\b/g,
  python: /\b(def|return|import|from|if|elif|else|for|while|in|class|try|except|raise|with|as|lambda|not|and|or|True|False|None|print|self|pass|break|continue)\b/g,
  bash: /\b(set|echo|ssh|rsync|systemctl|pnpm|install|build|if|then|fi|exit|cd|mkdir|rm|cp|mv|grep|curl|tar|docker|npm|node|service|restart|unset|local|done|esac)\b/g,
  shell: /\b(set|echo|ssh|rsync|systemctl|pnpm|install|build|if|then|fi|exit|cd|mkdir|rm|cp|mv|grep|curl|tar|docker|npm|node|service|restart)\b/g,
  json: null,
  html: /\b(div|span|section|article|a|img|script|style|class|href|src|id|html|head|body|meta|title|header|footer|nav|ul|li)\b/g
};

function hl(lang, code) {
  const kw = KEYWORDS[lang] || null;
  if (!kw) return esc(code);
  return code.split('\n').map(line => {
    const RE = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/[^\n]*|#[^\n]*|<!--.*?-->)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g;
    let out = '', m, last = 0;
    while ((m = RE.exec(line))) {
      out += esc(line.slice(last, m.index));
      if (m[1]) out += '<span class="tok-s">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="tok-c">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tok-n">' + esc(m[3]) + '</span>';
      else {
        kw.lastIndex = 0;
        out += kw.test(m[4]) ? '<span class="tok-k">' + esc(m[4]) + '</span>' : esc(m[4]);
      }
      last = m.index + m[0].length;
    }
    return out + esc(line.slice(last));
  }).join('\n');
}

function mathSpan(tex, display) {
  if (window.katex) {
    try {
      return katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) {}
  }
  return display
    ? '<div class="math-fb block">$$' + esc(tex) + '$$</div>'
    : '<code class="math-fb">$' + esc(tex) + '$</code>';
}

function imgChip(alt, src) {
  const name = src.split('/').pop() || src;
  return '<span class="img-chip">' + icon('image') +
    '<span><span class="img-chip-name">' + esc(name) + '</span><br><span class="img-chip-sub">本地图片 · 已复制到 assets/</span></span></span>';
}

function mathify(seg) {
  const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
  let out = '', m, last = 0;
  while ((m = re.exec(seg))) {
    out += seg.slice(last, m.index);
    out += mathSpan((m[1] || m[2] || '').trim(), !!m[1]);
    last = m.index + m[0].length;
  }
  return out + seg.slice(last);
}

function inline(t) {
  t = esc(t);
  const parts = t.split('`');
  t = parts.map((p, i) => i % 2 === 1 ? '<code>' + p + '</code>' : mathify(p)).join('');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, a, s) => imgChip(a, s));
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}

function codeBlock(lang, code) {
  const name = lang || 'text';
  return '<figure class="codeblock"><figcaption class="cb-head"><span class="cb-lang">' + esc(name) +
    '</span><button class="cb-copy" data-code="' + esc(code) + '">' + icon('copy') + '复制</button></figcaption>' +
    '<pre><code>' + hl(lang, code) + '</code></pre></figure>';
}

function tableHtml(rows) {
  const split = (r) => r.split('|').slice(1, -1).map(c => c.trim());
  const head = split(rows[0]);
  const body = rows.slice(2);
  let h = '<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
  body.forEach(r => {
    const cells = split(r);
    h += '<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function renderMD(src) {
  const lines = src.split('\n');
  let html = '', fence = null, flang = '', fbuf = [], qBuf = [], ulBuf = [], olBuf = [];
  const flushQ = () => { if (qBuf.length) { html += '<blockquote>' + qBuf.map(x => '<p>' + inline(x) + '</p>').join('') + '</blockquote>'; qBuf = []; } };
  const flushUL = () => { if (ulBuf.length) { html += '<ul>' + ulBuf.join('') + '</ul>'; ulBuf = []; } };
  const flushOL = () => { if (olBuf.length) { html += '<ol>' + olBuf.join('') + '</ol>'; olBuf = []; } };
  const flushAll = () => { flushQ(); flushUL(); flushOL(); };

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const fm = l.match(/^\s*```([\w+-]*)\s*$/);
    if (fence) {
      if (fm) { html += codeBlock(flang, fbuf.join('\n')); fence = null; fbuf = []; flang = ''; }
      else fbuf.push(l);
      continue;
    }
    if (fm) { flushAll(); fence = true; flang = fm[1]; continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);
    const hr = /^\s*[-*_]{3,}\s*$/.test(l);
    const q = l.match(/^\s*>\s?(.*)$/);
    const task = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
    const ul = l.match(/^\s*[-*]\s+(.*)$/);
    const ol = l.match(/^\s*\d+[.)]\s+(.*)$/);
    const img = l.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);

    if (h || hr || img || l.trim() === '' || (l.startsWith('|') && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1]))) flushAll();

    if (h) { html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; continue; }
    if (hr) { html += '<hr>'; continue; }
    if (q) { flushUL(); flushOL(); qBuf.push(q[1]); continue; }
    if (l.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i]); i++; }
      i--;
      html += tableHtml(rows);
      continue;
    }
    if (task) { flushQ(); flushOL(); ulBuf.push('<li class="task' + (task[1] !== ' ' ? ' done' : '') + '"><input type="checkbox" data-task ' + (task[1] !== ' ' ? 'checked' : '') + '><span>' + inline(task[2]) + '</span></li>'); continue; }
    if (ul) { flushQ(); flushOL(); ulBuf.push('<li>' + inline(ul[1]) + '</li>'); continue; }
    if (ol) { flushQ(); flushUL(); olBuf.push('<li>' + inline(ol[1]) + '</li>'); continue; }
    if (img) { html += '<p>' + imgChip(img[1], img[2]) + '</p>'; continue; }
    if (l.trim() === '') { flushAll(); continue; }
    flushAll();
    html += '<p>' + inline(l) + '</p>';
  }
  flushAll();
  if (fence) html += codeBlock(flang, fbuf.join('\n'));
  return html;
}

/* ═══════════════════════════════════════════════════════════════════
   视图与过滤
   ═══════════════════════════════════════════════════════════════════ */
function visibleNotes() {
  let notes = vaultNotes(state.vaultId);
  const v = state.view;
  if (v.type === 'trash') return vaultNotes(state.vaultId, true).filter(n => n.trashed).sort((a, b) => (b.trashedAt || 0) - (a.trashedAt || 0));
  if (v.type === 'starred') notes = notes.filter(n => n.starred);
  if (v.type === 'folder') notes = notes.filter(n => n.folder === v.key);
  if (v.type === 'tag') notes = notes.filter(n => n.tags.includes(v.key));
  if (v.type === 'recent') notes = notes.slice().sort((a, b) => b.modified - a.modified);
  const q = state.query.trim().toLowerCase();
  if (q) {
    notes = notes.filter(n =>
      n.title.toLowerCase().includes(q) ||
      n.content.toLowerCase().includes(q) ||
      n.tags.some(t => t.toLowerCase().includes(q))
    );
  }
  notes = notes.slice().sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if (state.sort === 'title') return a.title.localeCompare(b.title, 'zh');
    if (state.sort === 'created') return b.created - a.created;
    return b.modified - a.modified;
  });
  return notes;
}

/* ═══════════════════════════════════════════════════════════════════

function renderSidebar() {
  const notes = vaultNotes(state.vaultId);

  $$('#nav-smart .nav-row').forEach(r => {
    r.classList.toggle('sel', state.view.type === r.dataset.nav && !state.query);
  });

  const folders = [...new Set(notes.filter(n => !n.trashed).map(n => n.folder))];
  const fState = store.get('foldersOpen', {});
  let fh = '';
  folders.forEach(f => {
    const list = notes.filter(n => !n.trashed && n.folder === f);
    const open = fState[f] !== false;
    const md = list.filter(n => n.type === 'md').length;

      '<svg class="ic f-caret' + (open ? ' open' : '') + '"><use href="#i-chev-r"/></svg>' +
      '<svg class="ic"><use href="#i-folder"/></svg>' +
      '<span class="n-label">' + esc(f) + '</span>' +
      '<span class="f-badges">' +
      (md ? '<span class="f-badge md">MD ' + md + '</span>' : '') +
      (txt ? '<span class="f-badge txt">TXT ' + txt + '</span>' : '') +
      '</span></button>';
    if (open) {
      list.slice().sort((a, b) => b.modified - a.modified).forEach(n => {
        fh += '<button class="nav-row leaf-row tip" data-action="leaf-open" data-note="' + n.id + '" data-tip="' + esc(n.title) + '">' +
          (n.type === 'md'

          (n.pinned ? icon('pin') : '') +
          '</button>';
      });
    }
    fh += '</div>';
  });
  el('folder-tree').innerHTML = fh;

  const tagCounts = {};
  notes.filter(n => !n.trashed).forEach(n => n.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
  const tState = store.get('tagsOpen', true);
  let th = '';
  const tagEntries = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
  const shown = tState ? tagEntries : tagEntries.slice(0, 4);
  shown.forEach(([t, c]) => {
    const isSel = state.view.type === 'tag' && state.view.key === t && !state.query;
    th += '<button class="nav-row tag-row' + (isSel ? ' sel' : '') + '" data-action="tag-select" data-tag="' + t + '" data-od-id="tag-row-' + t + '">' +
      '<span class="tag-dot ' + tagDotCls(t) + '"></span>' +
      '<span class="n-label">' + esc(t) + '</span><span class="n-count">' + c + '</span></button>';
  });
  if (!tState && tagEntries.length > 4) th += '<button class="nav-row tag-row" data-action="tags-more"><span class="n-label" style="color:var(--muted)">展开全部 ' + tagEntries.length + ' 个标签</span></button>';
  else if (tState && tagEntries.length > 4) th += '<button class="nav-row tag-row" data-action="tags-less"><span class="n-label" style="color:var(--muted)">收起</span></button>';
  el('tag-list').innerHTML = th;
}

    '<div class="card-title">' + esc(n.title) + '</div>' +

function renderList() {
  el('list-title').textContent = viewTitle();
  const notes = visibleNotes();
  const isTrash = state.view.type === 'trash' && !state.query;
  el('list-count').textContent = notes.length + ' 篇';
  el('note-list').classList.toggle('grid', state.viewMode === 'grid' && !isTrash);
  el('sort-btn').hidden = isTrash;
  el('sort-label').textContent = state.sort === 'title' ? '按标题' : state.sort === 'created' ? '按创建时间' : '按修改时间';
  $$('#view-toggle .seg-btn').forEach(b => b.classList.toggle('sel', b.dataset.view === state.viewMode));

  const listEl = el('note-list');
  if (!notes.length) {
    listEl.innerHTML = '';
    const c = el('trash-clear');
    if (c) c.remove();
    showEmpty(isTrash);
    return;
  }
  el('list-empty').classList.remove('show');
  listEl.innerHTML = isTrash
    ? notes.map(trashCardHtml).join('')
    : notes.map(noteCardHtml).join('');

  if (isTrash) {
    let c = el('trash-clear');
    if (!c) {
      c = document.createElement('button');
      c.id = 'trash-clear';
      c.className = 'trash-clear';
      c.dataset.action = 'trash-clear';
      c.dataset.odId = 'trash-clear';
      c.innerHTML = icon('trash-all') + '清空回收站';
      c.style.cssText = 'display:flex;align-items:center;gap:5px';
      el('lh-tools').appendChild(c);
    }
  } else {
    const c = el('trash-clear');
    if (c) c.remove();
  }
}

function showEmpty(isTrash) {
  const e = el('list-empty');
  e.classList.add('show');
  const iconEl = el('le-icon'), titleEl = el('le-title'), subEl = el('le-sub'), actEl = el('le-action');
  const q = state.query.trim();
  if (q) {
    iconEl.innerHTML = icon('search');
    titleEl.innerHTML = '未找到与「' + esc(q) + '」相关的内容';
    subEl.textContent = '试试更短的关键词，或检查标题、正文与标签。';
    actEl.hidden = true;
  } else if (isTrash) {
    iconEl.innerHTML = icon('trash');
    titleEl.textContent = '回收站是空的';
    subEl.textContent = '删除的笔记会先进入这里，可以恢复或彻底删除。';
    actEl.hidden = true;
  } else if (state.view.type === 'starred') {
    iconEl.innerHTML = icon('star');
    titleEl.textContent = '还没有收藏的笔记';
    subEl.textContent = '点击卡片上的星标，重要笔记就会出现在这里。';
    actEl.hidden = true;
  } else if (state.view.type === 'folder') {
    iconEl.innerHTML = icon('folder');
    titleEl.textContent = '此文件夹还没有笔记';
    subEl.textContent = '在该文件夹中新建一篇 Markdown 或文本笔记。';
    actEl.hidden = false;
  } else if (state.view.type === 'tag') {
    iconEl.innerHTML = icon('tag');
    titleEl.textContent = '此标签下暂无笔记';
    subEl.textContent = '给笔记添加标签后即可在此归类查看。';
    actEl.hidden = false;
  } else {
    iconEl.innerHTML = icon('all');
    titleEl.textContent = '还没有笔记';
    subEl.textContent = '新建第一篇笔记，或从其他文件夹导入。';
    actEl.hidden = false;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   渲染：编辑器
   ═══════════════════════════════════════════════════════════════════ */
function activeNote() { return noteById(state.activeTab); }

function renderTabs() {
  const sc = el('tab-scroll');
  if (!state.tabs.length) { sc.innerHTML = ''; return; }
  sc.innerHTML = state.tabs.map(id => {
    const n = noteById(id);
    if (!n) return '';
    const sel = id === state.activeTab;
    return '<div class="tab' + (sel ? ' sel' : '') + '" data-action="tab-select" data-note="' + id + '" data-od-id="tab-' + id + '" role="tab" aria-selected="' + sel + '">' +
      (n.type === 'md'
        ? '<svg class="ic t-type md"><use href="#i-file-md"/></svg>'
        : '<svg class="ic t-type txt"><use href="#i-file-txt"/></svg>') +
      '<span class="t-name">' + esc(n.title) + '</span>' +
      (state.dirty[id] ? '<span class="t-dot" title="未保存"></span>' : '') +
      '<button class="t-close" data-action="tab-close" data-note="' + id + '" aria-label="关闭标签页">' + icon('x') + '</button>' +
      '</div>';

}

function renderEditor() {
  const n = activeNote();
  const emptyEl = el('editor-empty'), bodyEl = el('editor-body');
  if (!n) {
    emptyEl.style.display = 'flex';
    bodyEl.style.display = 'none';
    el('fmt-group').style.display = 'none';
    el('txt-hint').style.display = 'none';
    el('json-toolbar').classList.remove('open');
    el('sb-save').className = 'sb-save saved';
    el('sb-save-text').textContent = '已保存';
    el('sb-words').textContent = '0 字';
    el('sb-pos').textContent = '';
    el('sb-lang').textContent = '';
    el('sb-wrap').hidden = true;
    return;
  }
  emptyEl.style.display = 'none';
  bodyEl.style.display = 'flex';

  const ta = el('editor-area');
  if (ta.value !== n.content) ta.value = n.content;
  ta.classList.toggle('wrap', n.type === 'txt' && state.settings.wrap);
  el('editor-area').style.fontFamily = 'var(--editor-font)';
  updateGutter();

  const isJson = !!detectJson(n.content);
  el('fmt-group').style.display = n.type === 'md' ? 'flex' : 'none';
  el('txt-hint').style.display = n.type === 'txt' && !isJson ? 'flex' : 'none';
  el('json-toolbar').classList.toggle('open', isJson);
  el('json-tree-btn').classList.toggle('active', state.treeOpen);
  el('sb-wrap').hidden = !(n.type === 'txt');
  el('sb-wrap-label').textContent = state.settings.wrap ? '自动换行：开' : '自动换行：关';
  el('sb-lang').textContent = isJson ? 'JSON' : n.type === 'md' ? 'Markdown' : '纯文本';
  el('sb-lang').classList.toggle('json', isJson);

  const previewOnly = state.mode === 'preview';
  el('editor-gutter').style.display = previewOnly ? 'none' : 'block';
  ta.style.display = previewOnly ? 'none' : 'block';
  el('split-drag').style.display = (state.mode === 'split' && n.type !== 'txt') ? 'block' : 'none';
  $$('#mode-toggle .seg-btn').forEach(b => b.classList.toggle('sel', b.dataset.mode === state.mode));
  renderPreview();
  updateStatusMeta();
}

function updateGutter() {
  const ta = el('editor-area');
  const lines = ta.value.split('\n').length;
  let out = '';
  for (let i = 1; i <= lines; i++) out += i + '\n';
  el('gutter-nums').textContent = out;
}

function updateStatusMeta() {
  const n = activeNote();
  if (!n) return;
  el('sb-words').textContent = wordCount(n.content) + ' 字';
  const ta = el('editor-area');
  const upto = ta.value.slice(0, ta.selectionStart);
  const line = upto.split('\n').length;
  const col = ta.selectionStart - upto.lastIndexOf('\n');
  el('sb-pos').textContent = '行 ' + line + '，列 ' + col;
  const save = el('sb-save');
  if (state.dirty[n.id]) {
    save.className = 'sb-save';
    el('sb-save-text').textContent = '未保存';
  } else {
    save.className = 'sb-save saved';
    el('sb-save-text').textContent = '已保存 ' + fmtTime(Date.now());
  }
}

function renderPreview() {
  const n = activeNote();
  const pv = el('editor-preview');
  if (!n || state.mode === 'edit') { pv.style.display = 'none'; return; }
  pv.style.display = 'block';
  pv.classList.toggle('center', state.mode === 'preview');
  if (n.type === 'txt' && !detectJson(n.content)) {
    pv.innerHTML = '<pre class="txt">' + esc(n.content) + '</pre>';
  } else if (detectJson(n.content)) {
    pv.innerHTML = '<pre class="txt">' + esc(n.content) + '</pre>';
  } else {
    pv.innerHTML = renderMD(n.content);
  }
  $$('.cb-copy', pv).forEach(b => {
    b.addEventListener('click', () => {
      copyText(b.dataset.code);
      toast('已复制代码', false);
    });
  });
  $$('.math-fb', pv).forEach(() => {});
}

/* ═══════════════════════════════════════════════════════════════════
   JSON 树
   ═══════════════════════════════════════════════════════════════════ */
function jvalHtml(v, depth) {
  const pad = { paddingLeft: (depth * 14 + 4) + 'px' };
  if (v === null) return '<div class="jrow" style="padding-left:' + (depth * 14) + 'px"><span class="jval-z">null</span></div>';
  if (typeof v === 'object') {
    const isArr = Array.isArray(v);
    const keys = Object.keys(v);
    const kind = isArr ? 'array' : 'object';
    const count = keys.length;
    const children = keys.map(k => {
      const c = v[k];
      if (typeof c === 'object' && c !== null) {
        const sub = jvalHtml(c, depth + 1);
        return '<div class="jrow" data-depth="' + (depth + 1) + '"><span class="jkey">' + esc(k) + '</span><span class="jcolon">:</span><span class="jtype">' + (Array.isArray(c) ? '数组' : '对象') + ' · ' + Object.keys(c).length + ' 项</span></div>' + sub;
      }
      return '<div class="jrow" data-depth="' + (depth + 1) + '"><span class="jkey">' + esc(k) + '</span><span class="jcolon">:</span>' + jleaf(c) + '</div>';
    }).join('');
    return '<div class="jnode" data-kind="' + kind + '" data-count="' + count + '">' +
      '<div class="jrow" data-depth="' + depth + '">' +
      '<svg class="ic jt open"><use href="#i-chev-r"/></svg>' +
      '<span class="jkey">' + (isArr ? '[' + count + ']' : '{' + count + '}') + '</span>' +
      '<span class="jtype">' + (isArr ? '数组' : '对象') + '</span></div>' +
      '<div class="jchildren">' + children + '</div></div>';
  }
  return '<div class="jrow" data-depth="' + depth + '">' + jleaf(v) + '</div>';
}

function jleaf(v) {
  if (typeof v === 'string') return '<span class="jval-s">"' + esc(v.length > 60 ? v.slice(0, 60) + '…' : v) + '"</span>';
  if (typeof v === 'number') return '<span class="jval-n">' + v + '</span>';
  if (typeof v === 'boolean') return '<span class="jval-b">' + v + '</span>';
  return '<span class="jval-z">' + String(v) + '</span>';
}

function renderJsonTree() {
  const n = activeNote();
  const data = n && detectJson(n.content);
  if (!data) { el('json-drawer').classList.remove('open'); state.treeOpen = false; return; }
  const isArr = Array.isArray(data);
  el('jd-summary').textContent = '根' + (isArr ? '数组' : '对象') + ' · ' + Object.keys(data).length + ' 项';
  el('jd-body').innerHTML = jvalHtml(data, 0);
}

}

function applyFontSettings() {

/* ─── 菜单 ───────────────────────────────────────────────────────── */
let menuEl = null;
function closeMenu() {
  if (menuEl) { menuEl.classList.remove('open'); setTimeout(() => menuEl.remove(), 180); menuEl = null; }
  el('vault-switcher').setAttribute('aria-expanded', 'false');
  el('btn-new').setAttribute('aria-expanded', 'false');
}
function openMenu(anchor, items) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu';
  items.forEach(it => {
    if (it.divider) { const d = document.createElement('div'); d.className = 'menu-divider'; m.appendChild(d); return; }
    if (it.title) { const t = document.createElement('div'); t.className = 'menu-title'; t.textContent = it.title; m.appendChild(t); return; }
    const b = document.createElement('button');
    b.className = 'menu-item' + (it.danger ? ' danger' : '');
    b.innerHTML = (it.icon ? icon(it.icon) : '<span class="m-ic"></span>') +
      '<span class="m-label">' + esc(it.label) + '</span>' +
      (it.hint ? '<span class="m-hint">' + esc(it.hint) + '</span>' : '') +
      (it.checked ? '<svg class="ic m-check"><use href="#i-check"/></svg>' : '');
    b.addEventListener('click', () => { closeMenu(); it.action && it.action(); });
    if (it.hintAction) {
      const h = b.querySelector('.m-hint');
      if (h) {
        h.style.cssText = 'color:var(--danger);cursor:pointer;padding:2px 4px;border-radius:4px';
        h.title = it.hintTitle || '移除';
        h.addEventListener('click', (ev) => {
          ev.stopPropagation();
          closeMenu();
          it.hintAction();
        });
      }
    }
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + 6) + 'px';
  if (r.bottom + m.offsetHeight + 8 > window.innerHeight) m.style.top = Math.max(8, r.top - m.offsetHeight - 6) + 'px';
  requestAnimationFrame(() => m.classList.add('open'));
  menuEl = m;
}

function vaultMenuItems() {
  return VAULTS.map(v => ({
    label: v.name,
    icon: 'vault',
    hint: v.id === state.vaultId ? v.path : v.path + ' · ' + NOTES.filter(n => n.vault === v.id && !n.trashed).length + ' 篇',
    checked: v.id === state.vaultId,
    hintTitle: '移除「' + v.name + '」库',
    hintAction: () => {
      if (v.id === state.vaultId) {
        const rest = VAULTS.filter(x => x.id !== v.id);
        if (!rest.length) { toast('不能移除最后一个笔记库', true); return; }
        VAULTS.splice(VAULTS.indexOf(v), 1);
        state.vaultId = rest[0].id;
        state.tabs = []; state.activeTab = null;
        renderSidebar(); renderList(); renderTabs(); renderEditor();
        toast('已移除「' + v.name + '」库', false);
      } else {
        VAULTS.splice(VAULTS.indexOf(v), 1);
        renderSidebar(); renderList();
        toast('已移除「' + v.name + '」库', false);
      }
    },
    action: () => { if (v.id !== state.vaultId) switchVault(v.id); }
  })).concat([
    { divider: true },
    { label: '添加新库', icon: 'plus', action: () => { el('vault-add-row').classList.add('open'); el('vault-add-input').focus(); } },
    { label: '打开其他文件夹…', icon: 'folder', action: () => toast('原型演示：已打开文件夹选择器', false) },
    { label: '管理笔记库…', icon: 'gear', action: openSettings }
  ]);
}

/* ═══════════════════════════════════════════════════════════════════
   行为
   ═══════════════════════════════════════════════════════════════════ */
function switchVault(id) {
  state.vaultId = id;
  store.set('vault', id);
  state.view = { type: 'all', key: null };
  state.query = '';
  el('search-field').value = '';
  el('search-wrap').classList.remove('has-q');
  state.tabs = state.tabs.filter(t => noteById(t) && noteById(t).vault === id);
  if (!state.tabs.includes(state.activeTab)) state.activeTab = state.tabs[0] || null;
  const lp = el('listpane');
  lp.classList.add('switching');
  setTimeout(() => {
    renderSidebar();
    renderList();
    renderTabs();
    renderEditor();
    lp.classList.remove('switching');
  }, 140);
  toast('已切换到「' + vaultById(id).name + '」库', false);
}

function setTheme(th) {
  state.theme = th;
  store.set('theme', th);
  document.documentElement.setAttribute('data-theme', th);
  el('theme-btn').innerHTML = th === 'light' ? icon('moon') : icon('sun');
  el('theme-btn').dataset.tip = th === 'light' ? '切换到深色' : '切换到浅色';
}

function createNote(type) {
  const v = vaultById(state.vaultId);
  const folder = state.view.type === 'folder' && state.view.key ? state.view.key : '未分类';
  const base = type === 'md' ? '未命名笔记' : '未命名文本';
  let i = 1, title = base;
  while (NOTES.some(n => n.title === title && n.vault === state.vaultId)) title = base + ' ' + (++i);
  const n = {
    id: 'n' + Date.now(), vault: state.vaultId, folder, type,
    tags: [], starred: false, pinned: false, created: now, modified: now,
    content: type === 'md' ? '' : ''
  };
  NOTES.push(n);
  openNote(n.id, true);
  state.view = { type: 'folder', key: folder };
  renderSidebar();
  renderList();
  toast('已创建「' + title + '」', false);
}

function openNote(id, focus) {
  const n = noteById(id);
  if (!n || n.trashed) return;
  if (!state.tabs.includes(id)) state.tabs.push(id);
  state.activeTab = id;
  store.set('tabs', state.tabs);
  store.set('active', id);
  renderTabs();
  renderList();
  renderEditor();
  if (focus) el('editor-area').focus();
}

function closeTab(id) {
  const i = state.tabs.indexOf(id);
  if (i < 0) return;
  state.tabs.splice(i, 1);
  if (state.activeTab === id) state.activeTab = state.tabs[Math.max(0, i - 1)] || null;
  if (!state.tabs.length) state.activeTab = null;
  store.set('tabs', state.tabs);
  store.set('active', state.activeTab || null);
  renderTabs();
  renderList();
  renderEditor();
}

function deleteNote(id) {
  const n = noteById(id);
  if (!n) return;
  n.trashed = true;
  n.trashedAt = now;
  if (state.activeTab === id) closeTab(id);
  state.view = { type: 'trash', key: null };
  renderSidebar();
  renderList();
  renderEditor();
  toast('已移到回收站', false);
}

function restoreNote(id) {
  const n = noteById(id);
  if (!n) return;
  delete n.trashed; delete n.trashedAt;
  n.modified = now;
  state.view = { type: 'all', key: null };
  renderSidebar();
  renderList();
  toast('已恢复「' + n.title + '」', false);
}

function purgeNote(id) {
  if (state.tabs.includes(id)) closeTab(id);
  const i = NOTES.findIndex(n => n.id === id);
  if (i < 0) return;
  const t = NOTES[i].title;
  NOTES.splice(i, 1);
  renderSidebar();
  renderList();
  toast('已彻底删除「' + t + '」', true);
}

function toggleStar(id) {
  const n = noteById(id);
  if (!n) return;
  n.starred = !n.starred;
  renderSidebar();
  renderList();
}
function togglePin(id) {
  const n = noteById(id);
  if (!n) return;
  n.pinned = !n.pinned;
  renderSidebar();
  renderList();
}

/* ─── 编辑操作 ───────────────────────────────────────────────────── */
function insertMarkdown(before, after, placeholder) {
  const ta = el('editor-area');
  const n = activeNote();
  if (!n || n.type !== 'md') return;
  ta.focus();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || placeholder || '';
  const nl = s > 0 && ta.value[s - 1] !== '\n' ? '\n' : '';
  const nl2 = e < ta.value.length && ta.value[e] !== '\n' ? '\n' : '';
  const insert = before + sel + after;
  ta.setRangeText(insert, s, e, 'end');
  markDirty();
  ta.focus();
  const pos = s + before.length;
  ta.setSelectionRange(pos, pos + sel.length);
  updateStatusMeta();
}

function markDirty() {
  const n = activeNote();
  if (!n) return;
  n.content = el('editor-area').value;
  n.modified = now;
  state.dirty[n.id] = true;
  renderTabs();
  updateStatusMeta();
  const isJson = !!detectJson(n.content);
  el('json-toolbar').classList.toggle('open', isJson);
  el('sb-lang').textContent = isJson ? 'JSON' : n.type === 'md' ? 'Markdown' : '纯文本';
  el('sb-lang').classList.toggle('json', isJson);
  if (state.mode !== 'edit') schedulePreview();
  clearTimeout(markDirty._t);
  markDirty._t = setTimeout(() => {
    delete state.dirty[n.id];
    renderTabs();
    updateStatusMeta();
  }, 1000);
}

let pvTimer = null;
function schedulePreview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(renderPreview, 260);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
  else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
}

/* ─── Toast ──────────────────────────────────────────────────────── */
function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.innerHTML = icon(isErr ? 'warn' : 'check') + '<span>' + esc(msg) + '</span>';
  el('toasts').appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 240);
  }, 2400);
}

/* ─── 设置开关 ───────────────────────────────────────────────────── */
function openSettings() {
  el('settings-modal').classList.add('open');
  renderSettings();
}
function closeSettings() { el('settings-modal').classList.remove('open'); }

   ═══════════════════════════════════════════════════════════════════ */

        ]);
