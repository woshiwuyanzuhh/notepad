      }
    },
    'clean-toggle'() {
      document.getElementById('app').classList.toggle('clean');
      if (document.getElementById('app').classList.contains('clean')) toast('已进入纯净模式，按 Esc 退出', false);
    },
    'theme-toggle'() { setTheme(state.theme === 'light' ? 'dark' : 'light'); },
    'settings-open'() { openSettings(); },
    'settings-close'() { closeSettings(); },
    'settings-tab'() { state.settingsTab = el2.dataset.tab; renderSettings(); },
    'theme-set'() { setTheme(el2.dataset.theme); renderSettings(); },
    'set-font'() { state.settings.font = el2.value; store.set('settings', state.settings); applyFontSettings(); renderSettings(); },
    'set-size'() {
      state.settings.size = +el2.value;
      store.set('settings', state.settings);
      applyFontSettings();
      el('set-size-val').textContent = state.settings.size + 'px';
      el('font-preview').style.fontSize = state.settings.size + 'px';
    },
    'wrap-set'() { state.settings.wrap = el2.dataset.wrap === '1'; store.set('settings', state.settings); renderSettings(); renderEditor(); },
    'replay-welcome'() { closeSettings(); showWelcome(); },
    'win-min'() { toast('原型演示：窗口已最小化', false); },
    'win-max'() { toast('原型演示：窗口最大化/还原', false); },
    'win-close'() { toast('原型演示：点击关闭窗口', false); },

    /* 侧栏 */
    'nav-select'() {
      state.view = { type: el2.dataset.nav, key: null };
      renderSidebar(); renderList();
    },
    'folder-toggle'() {
      const f = el2.dataset.folder;
      const fs = store.get('foldersOpen', {});
      fs[f] = fs[f] === false;
      store.set('foldersOpen', fs);
      state.view = { type: 'folder', key: f };
      renderSidebar(); renderList();
    },
    'leaf-open'() { openNote(el2.dataset.note, false); },
    'tag-select'() { state.view = { type: 'tag', key: el2.dataset.tag }; renderSidebar(); renderList(); },
    'tags-more'() { store.set('tagsOpen', true); renderSidebar(); },
    'tags-less'() { store.set('tagsOpen', false); renderSidebar(); },
    'rail-toggle'() {
      state.rail = !state.rail;
      store.set('rail', state.rail);
      document.getElementById('app').classList.toggle('rail', state.rail);
    },

    /* 列表 */
    'card-select'() { openNote(el2.dataset.note, false); },
    'star-toggle'() { toggleStar(el2.dataset.note); },
    'pin-toggle'() { togglePin(el2.dataset.note); },
    'note-delete'() { deleteNote(el2.dataset.note); },
    'note-restore'() { restoreNote(el2.dataset.note); },
    'note-purge'() { purgeNote(el2.dataset.note); },
    'trash-clear'() {
      NOTES.forEach(n => { if (n.trashed) { const i = NOTES.indexOf(n); NOTES.splice(i, 1); } });
      renderSidebar(); renderList();
      toast('回收站已清空', false);
    },
    'view-set'() { state.viewMode = el2.dataset.view; store.set('view', state.viewMode); renderList(); },
    'sort-menu'() {
      openMenu(el2, [
        { label: '按修改时间', icon: 'clock', checked: state.sort === 'modified', action: () => { state.sort = 'modified'; store.set('sort', state.sort); renderList(); } },
        { label: '按创建时间', icon: 'plus', checked: state.sort === 'created', action: () => { state.sort = 'created'; store.set('sort', state.sort); renderList(); } },
        { label: '按标题', icon: 'list', checked: state.sort === 'title', action: () => { state.sort = 'title'; store.set('sort', state.sort); renderList(); } }
      ]);
    },
    'empty-new'() { createNote('md'); },

    /* 标签页与编辑器 */
    'tab-select'() { openNote(el2.dataset.note, false); },
    'tab-close'() { closeTab(el2.dataset.note); },
    'mode-set'() { state.mode = el2.dataset.mode; store.set('mode', state.mode); renderEditor(); },
    'wrap-toggle'() { state.settings.wrap = !state.settings.wrap; store.set('settings', state.settings); renderEditor(); },
    'fmt-h1'() { insertMarkdown('# ', '', '标题'); },
    'fmt-bold'() { insertMarkdown('**', '**', '加粗文本'); },
    'fmt-italic'() { insertMarkdown('*', '*', '斜体文本'); },
    'fmt-quote'() { insertMarkdown('> ', '', '引用内容'); },
    'fmt-code'() { insertMarkdown('\n```\n', '\n```\n', '代码'); },
    'fmt-inline'() { insertMarkdown('`', '`', '代码'); },
    'fmt-link'() { insertMarkdown('[', '](https://)', '链接文字'); },
    'fmt-image'() { insertMarkdown('![', '](assets/图片.png)', '图片描述'); },
    'fmt-list'() { insertMarkdown('- ', '', '列表项'); },

    /* JSON */
    'json-format'() { jsonOp('format'); },
    'json-minify'() { jsonOp('minify'); },
    'json-validate'() { jsonOp('validate'); },
    'json-tree'() {
      const n = activeNote();
      if (!n || !detectJson(n.content)) return;
      state.treeOpen = !state.treeOpen;
      el('json-drawer').classList.toggle('open', state.treeOpen);
      el('json-tree-btn').classList.toggle('active', state.treeOpen);
      if (state.treeOpen) renderJsonTree();
    },
    'tree-collapse-all'() { $$('#jd-body .jchildren').forEach(c => { c.style.display = 'none'; }); $$('#jd-body .jt').forEach(t => t.classList.remove('open')); },
    'tree-expand-all'() { $$('#jd-body .jchildren').forEach(c => { c.style.display = 'block'; }); $$('#jd-body .jt').forEach(t => t.classList.add('open')); },

    /* 库 */
    'welcome-pick'() { pickVault(el2.dataset.vault); },
    'vault-add-open'() {
      if (el('welcome').classList.contains('open')) {
        el('welcome-add-row').hidden = false;
        el('welcome-add-input').focus();
      } else {
        closeSettings();
        el('vault-add-row').classList.add('open');
        el('vault-add-input').focus();
      }
    },
    'vault-add-cancel'() {
      el('vault-add-row').classList.remove('open');
      el('welcome-add-row').hidden = true;
    },
    'vault-add-confirm'() {
      const inWelcome = el('welcome').classList.contains('open');
      const input = inWelcome ? el('welcome-add-input') : el('vault-add-input');
      const name = input.value.trim();
      if (!name) { toast('请输入库名称', true); return; }
      if (VAULTS.some(v => v.name === name)) { toast('已存在同名笔记库', true); return; }
      const v = { id: 'v' + Date.now(), name, path: 'D:\\文档\\' + name };
      VAULTS.push(v);
      input.value = '';
      el('vault-add-row').classList.remove('open');
      el('welcome-add-row').hidden = true;
      renderWelcome();
      pickVault(v.id);
      toast('已创建并切换到「' + name + '」库', false);
    },
    'vault-open-folder'() { toast('原型演示：已选择文件夹，共导入 23 篇笔记', false); },
    'vault-set'() { pickVault(el2.dataset.vault); closeSettings(); },
    'vault-remove'() {
      const v = vaultById(el2.dataset.vault);
      if (!v) return;
      VAULTS.splice(VAULTS.indexOf(v), 1);
      if (state.vaultId === v.id) {
        if (!VAULTS.length) {
          state.vaultId = null;
          state.tabs = []; state.activeTab = null;
          closeSettings();
          renderTabs(); renderEditor();
          showWelcome();
          return;
        }
        state.vaultId = VAULTS[0].id;
        state.tabs = state.tabs.filter(t => noteById(t) && noteById(t).vault === state.vaultId);
        if (!state.tabs.includes(state.activeTab)) state.activeTab = state.tabs[0] || null;
      }
      renderSidebar(); renderList(); renderTabs(); renderEditor(); renderSettings();
      toast('已移除「' + v.name + '」库（文件未删除）', false);
    },
    'search-clear'() {
      state.query = '';
      el('search-field').value = '';
      el('search-wrap').classList.remove('has-q');
      renderSidebar(); renderList();
      el('search-field').focus();
    }
  };
  if (act[a]) act[a]();
});

function jsonOp(op) {
  const n = activeNote();
  if (!n) return;
  const data = detectJson(n.content);
  if (!data) { toast('JSON 校验失败：内容不是有效的 JSON', true); return; }
  if (op === 'validate') { toast('JSON 有效 ✓', false); return; }
  if (op === 'format') {
    const pretty = JSON.stringify(data, null, 2);
    if (pretty === n.content) { toast('JSON 已是格式化状态', false); return; }
    el('editor-area').value = pretty;
    markDirty();
    toast('已格式化', false);
  }
  if (op === 'minify') {
    const compact = JSON.stringify(data);
    if (compact === n.content) { toast('JSON 已是压缩状态', false); return; }
    el('editor-area').value = compact;
    markDirty();
    toast('已压缩', false);
  }
}

/* ─── JSON 树点击（事件委托） ────────────────────────────────────── */
el('jd-body').addEventListener('click', (e) => {
  const jt = e.target.closest('.jt');
  if (!jt) return;
  const row = jt.closest('.jrow');
  const children = row.nextElementSibling;
  if (!children || !children.classList.contains('jchildren')) return;
  const open = !row.classList.contains('open');
  row.classList.toggle('open', open);
  children.style.display = open ? 'block' : 'none';
});

/* ─── 预览内任务复选框 ───────────────────────────────────────────── */
el('editor-preview').addEventListener('click', (e) => {
  const cb = e.target.closest('input[data-task]');
  if (!cb) return;
  const n = activeNote();
  if (!n) return;
  const lines = n.content.split('\n');
  let idx = 0, target = -1;
  const tasks = [];
  lines.forEach((l, i) => {
    const m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
    if (m) tasks.push(i);
  });
  const clicked = $$('#editor-preview li.task').indexOf(cb.closest('li'));
  if (clicked >= 0 && tasks[clicked] !== undefined) {
    const li = tasks[clicked];
    const checked = cb.checked;
    lines[li] = lines[li].replace(/\[( |x|X)\]/, checked ? '[x]' : '[ ]');
    n.content = lines.join('\n');
    el('editor-area').value = n.content;
    state.dirty[n.id] = true;
    renderTabs();
    updateStatusMeta();
    renderPreview();
  }
});

/* ─── 搜索 ───────────────────────────────────────────────────────── */
el('search-field').addEventListener('input', (e) => {
  state.query = e.target.value;
  el('search-wrap').classList.toggle('has-q', !!state.query);
  renderSidebar();
  renderList();
});

/* ─── 编辑器输入 ─────────────────────────────────────────────────── */
el('editor-area').addEventListener('input', () => {
  updateGutter();
  markDirty();
});
el('editor-area').addEventListener('scroll', () => {
  el('editor-gutter').scrollTop = el('editor-area').scrollTop;
});
['click', 'keyup'].forEach(ev => el('editor-area').addEventListener(ev, updateStatusMeta));

/* ─── 分栏拖拽 ───────────────────────────────────────────────────── */
(function () {
  const drag = el('split-drag');
  let dragging = false;
  drag.addEventListener('mousedown', (e) => {
    dragging = true;
    drag.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const body = el('editor-body');
    const r = body.getBoundingClientRect();
    const pct = Math.min(0.75, Math.max(0.25, (e.clientX - r.left) / r.width));
    el('editor-area').style.flex = '0 0 ' + (pct * 100) + '%';
    el('editor-preview').style.flex = '1 1 0%';
  });
  document.addEventListener('mouseup', () => { dragging = false; drag.classList.remove('dragging'); });
})();

/* ─── 快捷键 ─────────────────────────────────────────────────────── */
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    el('search-field').focus();
    el('search-field').select();
    return;
  }
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); createNote('md'); return; }
  if (mod && e.key.toLowerCase() === 's') {
    e.preventDefault();
    const n = activeNote();
    if (n) { delete state.dirty[n.id]; renderTabs(); updateStatusMeta(); toast('已保存', false); }
    return;
  }
  if (mod && e.key.toLowerCase() === 'w') { e.preventDefault(); if (state.activeTab) closeTab(state.activeTab); return; }
  if (mod && e.key === 'Tab') {
    e.preventDefault();
    if (state.tabs.length > 1) {
      const i = state.tabs.indexOf(state.activeTab);
      openNote(state.tabs[(i + 1) % state.tabs.length], false);
    }
    return;
  }
  if (e.key === 'Escape') {
    if (menuEl) { closeMenu(); return; }
    if (el('json-drawer').classList.contains('open')) { state.treeOpen = false; el('json-drawer').classList.remove('open'); el('json-tree-btn').classList.remove('active'); return; }
    if (document.getElementById('app').classList.contains('clean')) { document.getElementById('app').classList.remove('clean'); return; }
    if (el('settings-modal').classList.contains('open')) { closeSettings(); return; }
    if (el('search-field') === document.activeElement) { el('search-field').blur(); }
    return;
  }
  if (e.key === 'Tab' && document.activeElement === el('editor-area')) {
    e.preventDefault();
    el('editor-area').setRangeText('  ', el('editor-area').selectionStart, el('editor-area').selectionEnd, 'end');
    markDirty();
  }
});

/* 点击空白处关闭抽屉类 */
document.addEventListener('mousedown', (e) => {
  if (state.treeOpen && !e.target.closest('#json-drawer') && !e.target.closest('[data-action="json-tree"]')) {
    state.treeOpen = false;
    el('json-drawer').classList.remove('open');
    el('json-tree-btn').classList.remove('active');
  }
});

function init() {

  document.getElementById('app').classList.toggle('rail', state.rail);

    setTimeout(showWelcome, 320);
  }
}
