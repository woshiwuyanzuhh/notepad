[package]
name = "notepad"
version = "0.1.0"
description = "记事本 - 本地个人笔记应用"
authors = ["personal"]
edition = "2021"

[lib]
name = "notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
